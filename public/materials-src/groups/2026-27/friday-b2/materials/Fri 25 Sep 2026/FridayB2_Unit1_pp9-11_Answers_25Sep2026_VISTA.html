<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1, pp. 9–11 — Answers · Friday B2 · Somerset Vista</title>
<!-- SOMERSET VISTA — Friday B2, Unit 1 pp.9-11 answer key (Grammar + Listening + Speaking).
     Cumulative reveal, one answer per press. Built 18 Sep 2026 for the 25 Sep class,
     from the New Close-up B2 Split A Student's Book answer key.
     Re-themed 18 Sep 2026 (v2): per Hugo, EVERY Friday B2 Vista now matches the
     Level Ladder Results design — plain white background, Georgia/Arial, dark ink
     + one green accent — not the dark data-deck skin used elsewhere (FCE I).
     Updated 24 Sep 2026: (1) fixed Q1's correct letter — was B (severe), the real answer key
     (Key, Unit 1.pdf, Listening p10 Ex5: 1A 2A 3C 4C 5B 6B 7A 8A) says A (embarrassing);
     (2) added a "why" line under every listening reveal, grounded in the audioscript, per Hugo's
     new standing rule — see feedback_vista_listening_reasoning_and_speaking_language.md;
     (3) replaced the "look at p.11" speaking pointer with the actual Useful Language box content
     on screen, same rule. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{ --ink:#222222; --mut:#6b6b6b; --panel:#ffffff; --bgpage:#f4f6f1;
  --green:#3F6E17; --brand:#6BAE2E; --err:#C03A2E; --line:#e2e2e2; }
html,body{width:100%;height:100%;overflow:hidden;background:var(--bgpage);font-family:Arial,Helvetica,sans-serif;}
#show{position:fixed;inset:0;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;}
.slide.active{display:flex;}
.bg{position:absolute;inset:0;background:var(--panel);border-top:9px solid var(--brand);}
.wm{position:absolute;top:3vh;left:3.5vw;z-index:6;display:flex;align-items:baseline;gap:8px;}
.wm .w{font-family:Georgia,serif;font-weight:700;font-size:clamp(18px,1.9vw,26px);color:var(--brand);}
.wm .lc{font-size:clamp(8px,.8vw,11px);letter-spacing:3px;color:var(--green);font-weight:700;}
.tag{position:absolute;top:3.2vh;right:4vw;z-index:6;font-size:clamp(10px,1vw,14px);letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--mut);}
.sc{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;justify-content:center;padding:10.5vh 6vw 6vh;}
.sc.centre{align-items:center;text-align:center;}
.pill{display:block;color:var(--green);font-size:clamp(12px,1.15vw,16px);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:800;}
.pill.centre{text-align:center;}
.t-super{font-family:Georgia,serif;font-size:clamp(40px,6.4vw,92px);color:var(--ink);font-weight:700;}
.t-big{font-family:Georgia,serif;font-size:clamp(24px,3.4vw,50px);color:var(--ink);font-weight:700;}
.rt{font-family:Georgia,serif;font-size:clamp(22px,2.8vw,38px);color:var(--ink);font-weight:700;margin-bottom:16px;line-height:1.1;}
.lead{font-size:clamp(18px,1.9vw,28px);color:var(--mut);font-weight:600;line-height:1.45;max-width:1100px;}
.rule{width:80px;height:3px;background:var(--brand);margin:18px auto;}
.strip{position:absolute;bottom:0;left:0;right:0;height:5px;z-index:4;background:var(--brand);}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:22px;padding:9px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-top:1px solid var(--line);}
.nb{background:transparent;border:1.5px solid var(--green);color:var(--green);font-size:18px;cursor:pointer;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.nb:hover{background:var(--green);color:#fff;}
#count{color:var(--mut);font-size:13px;letter-spacing:2px;min-width:64px;text-align:center;}
.hint{position:fixed;top:14px;right:1.6vw;z-index:100;color:rgba(0,0,0,.35);font-size:12px;letter-spacing:1px;}

/* ---- list rows ---- */
.list{width:100%;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;flex:1;gap:1vh;}
.row{display:flex;align-items:baseline;gap:1vw;padding:.5vh 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.row:last-child{border-bottom:none;}
.num{flex:0 0 auto;width:1.7em;font-weight:800;color:var(--green);text-align:right;font-size:.8em;}
.term{flex:1 1 auto;color:var(--ink);font-weight:700;}
.arrow{color:var(--green);font-weight:800;flex:0 0 auto;visibility:hidden;}
.row.on .arrow{visibility:visible;}
.ans{color:var(--green);font-weight:700;font-family:Georgia,serif;flex:0 0 auto;text-align:right;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--green);color:var(--green);font-weight:800;font-size:.78em;margin-right:.3em;}
.list--mid .row{font-size:clamp(22px,2.6vw,32px);font-weight:700;}
.list--loose .row{font-size:clamp(25px,3.1vw,38px);font-weight:700;}

/* ---- multiple-choice slides ---- */
.mcq{width:100%;max-width:1400px;margin:0 auto;}
.mcq .qtext{font-family:Georgia,serif;font-size:clamp(26px,3.2vw,42px);color:var(--ink);font-weight:700;margin-bottom:3vh;line-height:1.25;}
.opt{display:flex;align-items:baseline;gap:.9vw;padding:1.2vh 1.4vw;margin-bottom:1vh;border:1.5px solid var(--line);border-radius:10px;font-size:clamp(20px,2.3vw,30px);font-weight:700;color:var(--ink);}
.opt .oletter{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut);}
.opt.correct{border-color:var(--green);background:#eef5e6;color:var(--green);font-weight:800;}
.opt.correct .oletter{border-color:var(--green);background:var(--green);color:#fff;}
.whybox{margin-top:2vh;padding:1.6vh 1.8vw;background:#f4f6f1;border-left:5px solid var(--green);font-size:clamp(22px,2.4vw,30px);color:var(--ink);font-weight:600;line-height:1.4;}
.infobox{background:#f4f6f1;border-left:5px solid var(--green);padding:2vh 2.2vw;margin-bottom:1.4vh;max-width:1200px;}
.infobox h3{font-family:Georgia,serif;color:var(--green);font-size:clamp(17px,1.9vw,24px);margin-bottom:.6vh;}
.infobox p{font-size:clamp(23px,2.5vw,32px);color:var(--ink);font-weight:600;line-height:1.4;}
.infogrid{width:100%;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:1.4vh;flex:1;justify-content:center;}
</style>
</head>
<body>
<div id="show"></div>
<div class="hint">&larr; &rarr; · click to reveal / advance</div>
<div id="nav"><button class="nb" onclick="go(-1)">&#8249;</button><span id="count"></span><button class="nb" onclick="go(1)">&#8250;</button></div>
<script>
/* ============ SOURCE DATA — from the Student's Book answer key, Unit 1 ============ */
const T1 = {pill:"TASK 1 &middot; GRAMMAR", title:"Present simple (PS) or present continuous (PC)?", dense:"mid", items:[
 {n:"1. I'm getting more and more optimistic about the future.", a:"PC"},
 {n:"2. My sister's getting married next month.", a:"PC"},
 {n:"3. Helen lives alone in the city centre.", a:"PS"},
 {n:"4. In this photo, two people are arguing.", a:"PC"},
 {n:"5. The adult human brain weighs about 1.3 kilograms.", a:"PS"},
 {n:"6. What are you thinking about right now?", a:"PC"},
 {n:"7. You're always telling me what to do!", a:"PC"},
 {n:"8. The psychology lecture is at 12 o'clock every Monday this month.", a:"PS"},
 {n:"9. I go for a long walk every evening to relax.", a:"PS"},
 {n:"10. This week, we're studying the possible causes of stress and anxiety.", a:"PC"},
 {n:"11. At the end of the book, the man realises his mistake and apologises.", a:"PS"},
]};

const T2 = {pill:"TASK 2 &middot; GRAMMAR", title:"Present simple &mdash; which sentence, which use?", dense:"loose", items:[
 {n:"scientific facts and general truths", a:"sentence 5 &mdash; the brain weighs 1.3kg"},
 {n:"permanent situations", a:"sentence 3 &mdash; Helen lives alone"},
 {n:"habits and repeated actions", a:"sentence 9 &mdash; the evening walk"},
 {n:"timetabled and scheduled events", a:"sentence 8 &mdash; the lecture at 12"},
 {n:"narratives (stories, plots)", a:"sentence 11 &mdash; the man realises his mistake"},
]};

const T3 = {pill:"TASK 3 &middot; GRAMMAR", title:"Present continuous &mdash; which sentence, which use?", dense:"loose", items:[
 {n:"happening at the moment", a:"sentence 6 &mdash; what are you thinking?"},
 {n:"temporary situations", a:"sentence 10 &mdash; studying this week"},
 {n:"fixed future arrangements", a:"sentence 2 &mdash; sister's getting married"},
 {n:"annoying habits (always / forever)", a:"sentence 7 &mdash; always telling me what to do"},
 {n:"changing situations (+ comparatives)", a:"sentence 1 &mdash; more and more optimistic"},
 {n:"describing a picture", a:"sentence 4 &mdash; two people are arguing"},
]};

const T4 = {pill:"TASK 4 &middot; GRAMMAR", title:"The MRI dream experiment", dense:"dense", items:[
 {n:"1. It's 3 a.m. and ___ to sleep.", a:"I'm trying"},
 {n:"2. Every time ___, the scientist wakes me up.", a:"I drop off"},
 {n:"3. ___ him as much as I remember.", a:"I tell"},
 {n:"4. ___ in an experiment to help scientists.", a:"I'm taking part"},
 {n:"5. To understand what people ___ about.", a:"dream"},
 {n:"6. ___ inside an MRI scanner.", a:"I'm lying"},
 {n:"7. ___ for those same signals.", a:"he's looking"},
 {n:"8. To work out what ___ about.", a:"I'm dreaming"},
 {n:"9. That's why ___ waking me up.", a:"he keeps"},
 {n:"10. Amazingly, ___ to identify it 70% of the time.", a:"he seems"},
]};

const T5 = {pill:"TASK 5 &middot; GRAMMAR", title:"Four short dialogues", dense:"dense", items:[
 {n:"1. Why ___ (you/smile) in this photo? &mdash; I guess I ___ (always/smile) in photos.", a:"are you smiling / always smile"},
 {n:"2. They ___ (forever/change) the timetable, so I ___ (never/know) what time the bus ___ (come).", a:"are forever changing / never know / is coming"},
 {n:"3. Why ___ (you/get) so anxious? Our plane ___ (not/leave) until eight.", a:"are you getting / doesn't leave"},
 {n:"4. I ___ (read) a great book about teenagers who ___ (witness) a kidnapping, but no one ___ (believe) them.", a:"am reading / witness / believes"},
]};

const MC = {pill:"TASK 6 &middot; LISTENING &middot; EXAM TASK", title:"Multiple choice: one per text", items:[
 {q:"You hear a woman talking about her phobia of dentists. How does she describe it?", opts:{A:"embarrassing",B:"severe",C:"logical"}, correct:"A",
  why:"She says she feels \u2018a bit silly\u2019 and looks stressed \u2014 not that it\u2019s serious (severe), and she explicitly says there ISN\u2019T a reason (rules out logical)."},
 {q:"You hear a boy speaking to his father. What job does he like the least?", opts:{A:"washing the dishes",B:"watering the plants",C:"loading the dishwasher"}, correct:"A",
  why:"\u2018Why do I have to do the washing-up every evening? You know how much I hate it!\u2019 He says he doesn\u2019t mind watering the plants, and wouldn\u2019t mind loading a dishwasher."},
 {q:"You hear a head teacher speaking to a student. What is the head teacher worried about?", opts:{A:"the number of classes the student has missed",B:"the student's problems with concentration",C:"the student's poor academic results"}, correct:"C",
  why:"\u2018I want to talk to you about your grades... they\u2019ve fallen quite dramatically.\u2019 Missed classes and concentration are things she asks ABOUT, not the stated worry itself."},
 {q:"You hear a man talking about his driving test. What is he anxious about?", opts:{A:"needing to take more lessons",B:"failing the test",C:"not turning up for the test"}, correct:"C",
  why:"\u2018I\u2019m pretty sure I\u2019d pass the test\u2019 \u2014 he\u2019s confident about the driving itself. What scares him is getting cold feet and not showing up."},
 {q:"You hear a girl talking about horror films. What is her opinion of the film she saw last night?", opts:{A:"It was very amusing.",B:"It was very scary.",C:"It was disappointing."}, correct:"B",
  why:"\u2018I was absolutely terrified! It was so frightening!\u2019 \u2014 unusual for her, since horror films normally just make her laugh."},
 {q:"You hear a woman talking to her daughter. Why is she talking to her?", opts:{A:"to say that she is annoyed",B:"to cheer her daughter up",C:"to show a lack of confidence in her daughter"}, correct:"B",
  why:"\u2018It\u2019s not the end of the world!... Try to be positive... you should be very proud of what you\u2019ve achieved.\u2019 Reassuring and supportive throughout."},
 {q:"You overhear two people talking on a plane. How is the man feeling?", opts:{A:"ashamed",B:"relieved",C:"angry"}, correct:"A",
  why:"\u2018I actually feel bad about it... I guess it\u2019s too late to apologise.\u2019 He regrets losing his temper with the check-in guy \u2014 not currently relieved or angry, but ashamed."},
 {q:"You hear someone talking about living alone. How does he feel when he comes home?", opts:{A:"lonely",B:"frightened",C:"calm"}, correct:"A",
  why:"\u2018I do miss them and their company when I come home to a cold, dark, empty house. That\u2019s when I realise how alone I am.\u2019"},
]};

const T7 = {pill:"TASK 7 &middot; SPEAKING", title:"Build the question from the prompt", dense:"dense", items:[
 {n:"1. What / you / usually / do / the evenings?", a:"What do you usually do in the evenings?"},
 {n:"2. What / most interesting place / you / visit?", a:"What is the most interesting place you have (ever) visited?"},
 {n:"3. Which time / year / you / like best?", a:"Which time of (the) year do you like best?"},
 {n:"4. If / you / could learn / new skill / what / it / be?", a:"If you could learn a new skill, what would it be?"},
 {n:"5. How much time / you / spend / online?", a:"How much time do you (usually) spend online?"},
 {n:"6. you / do / anything interesting / yesterday?", a:"Did you do anything interesting yesterday?"},
 {n:"7. you / ever / speak / English / on holiday?", a:"Have you ever spoken English on holiday?"},
 {n:"8. What kind / job / you / like / do / in the future?", a:"What kind of job would you like to do in the future?"},
]};

/* ============ generic renderers ============ */
function rowHTML(item, i, revealed){
  const right = revealed
    ? `<span class="arrow on">&rarr;</span><span class="ans">${item.a}</span>`
    : `<span class="arrow">&rarr;</span>`;
  return `<div class="row${revealed?' on':''}"><span class="num">${i+1}</span><span class="term">${item.n}</span>${right}</div>`;
}

function buildOneList(S, pill, title, dense, items){
  const denseClass = dense === 'mid' ? 'list--mid' : 'list--loose';
  for(let revealed=0; revealed<=items.length; revealed++){
    const rows = items.map((it,i)=>rowHTML(it, i, i<revealed)).join('');
    S.push(`<div class="bg"></div>
     <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
     <div class="tag">Friday B2 &middot; Unit 1, pp. 9&ndash;11</div>
     <div class="sc"><div class="pill">${pill}</div>
      <h2 class="rt">${title}</h2>
      <div class="list ${denseClass}">${rows}</div>
     </div><div class="strip"></div>`);
  }
}

/* Splits long lists into chunks so text can stay big enough for a weak
   projector (fewer words, bigger — never shrink past the size floors
   above). Items with longer text (dense:"dense") get smaller chunks. */
function buildListSlides(S, task){
  const dense = task.dense === 'dense' ? 'mid' : task.dense;
  const maxRows = task.dense === 'dense' ? 4 : 6;
  if(task.items.length <= maxRows){
    buildOneList(S, task.pill, task.title, dense, task.items);
    return;
  }
  const chunks = [];
  for(let i=0; i<task.items.length; i+=maxRows) chunks.push(task.items.slice(i, i+maxRows));
  chunks.forEach((chunk, ci) => {
    buildOneList(S, task.pill, `${task.title} (${ci+1}/${chunks.length})`, dense, chunk);
  });
}

function buildMCSlides(S, task){
  task.items.forEach((item, qi) => {
    for(let revealed=0; revealed<=1; revealed++){
      const letters = Object.keys(item.opts);
      const opts = letters.map(letter => {
        const on = revealed && letter===item.correct;
        return `<div class="opt${on?' correct':''}"><span class="oletter">${letter}</span><span>${item.opts[letter]}${on?' &nbsp;&#10003;':''}</span></div>`;
      }).join('');
      const why = (revealed && item.why) ? `<div class="whybox">${item.why}</div>` : '';
      S.push(`<div class="bg"></div>
       <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
       <div class="tag">Friday B2 &middot; Unit 1, pp. 9&ndash;11</div>
       <div class="sc"><div class="pill">${task.pill}</div>
        <h2 class="rt">Question ${qi+1} of ${task.items.length}</h2>
        <div class="mcq"><div class="qtext">${item.q}</div>${opts}${why}</div>
       </div><div class="strip"></div>`);
    }
  });
}

function buildInfoSlide(S, tag, pill, title, boxes){
  const grid = boxes.map(b => `<div class="infobox"><h3>${b.h}</h3><p>${b.p}</p></div>`).join('');
  S.push(`<div class="bg"></div>
   <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
   <div class="tag">${tag}</div>
   <div class="sc"><div class="pill">${pill}</div>
    <h2 class="rt">${title}</h2>
    <div class="infogrid">${grid}</div>
   </div><div class="strip"></div>`);
}

/* ============ assemble the deck, in class order ============ */
const S = [];

S.push(`<div class="bg"></div>
 <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
 <div class="sc centre"><div class="pill centre">Unit 1, pages 9&ndash;11</div>
 <h1 class="t-super">Answers, one at a time</h1>
 <div class="rule"><span class="gem"></span><span class="gem"></span><span class="gem"></span></div>
 <p class="lead" style="text-align:center">Grammar &middot; Listening &middot; Speaking.<br>Press the right arrow. One answer appears each time.</p></div><div class="strip"></div>`);

buildListSlides(S, T1);   // Grammar Ex.1, PS/PC (12 slides)
buildListSlides(S, T2);   // Grammar Ex.2, PS uses (6 slides)
buildListSlides(S, T3);   // Grammar Ex.3, PC uses (7 slides)

// Stative verbs — the exception both PS and PC students need before the MRI cloze,
// where "dream" and "seems" stay simple even though the story is happening right now.
buildInfoSlide(S, "Friday B2 &middot; Unit 1, pp. 9&ndash;11", "GRAMMAR &middot; BEFORE TASK 4", "Stative verbs &mdash; the exception", [
 {h:"The rule", p:"Some verbs describe a state, not an action &mdash; even about right now, they stay in the present simple. <b>Not</b> “I'm knowing” or “I'm seeming tired”."},
 {h:"Thoughts &amp; opinions", p:"know &middot; understand &middot; believe &middot; think (= opinion) &middot; remember &middot; mean"},
 {h:"Feelings &amp; wants", p:"like &middot; love &middot; hate &middot; prefer &middot; want &middot; need"},
 {h:"Senses, possession &amp; other", p:"seem &middot; appear &middot; weigh &middot; cost &middot; belong &middot; have (= own) &middot; contain"},
]);
buildInfoSlide(S, "Friday B2 &middot; Unit 1, pp. 9&ndash;11", "GRAMMAR &middot; SPOT THEM", "Already seen two", [
 {h:"Task 1, sentence 5", p:"“The adult human brain <b>weighs</b> about 1.3 kilograms.” &mdash; a fact, so present simple, even though “weigh” never really needs the continuous at all."},
 {h:"Coming up in Task 4", p:"“To understand what people <b>dream</b> about” and “he <b>seems</b> to identify it 70% of the time” &mdash; the story is happening now, but these two verbs still can't take -ing."},
]);
buildListSlides(S, T4);   // Grammar Ex.4, MRI cloze (11 slides)
buildListSlides(S, T5);   // Grammar Ex.5, 4 dialogues (5 slides)
buildMCSlides(S, MC);     // Listening Exam Task, 8 questions (16 slides)
buildListSlides(S, T7);   // Speaking Ex.2, question building (9 slides)

// Speaking has no "correct answer" to reveal — it gets the real Useful Language box on
// screen instead, so students don't have to flip back to p.11 (Hugo's rule, 24 Sep 2026).
S.push(`<div class="bg"></div>
 <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
 <div class="tag">Friday B2 &middot; Unit 1, p. 11</div>
 <div class="sc centre"><div class="pill centre">Speaking, Exam Task</div>
 <h2 class="t-super" style="font-size:clamp(30px,5vw,68px)">Interview time</h2>
 <p class="lead" style="text-align:center;margin-top:20px;max-width:1000px">In pairs: Student A asks Task 1, Student B answers &mdash; then swap for Task 2.</p></div><div class="strip"></div>`);

S.push(`<div class="bg"></div>
 <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
 <div class="tag">Friday B2 &middot; Unit 1, p. 11</div>
 <div class="sc"><div class="pill">USEFUL LANGUAGE</div>
  <h2 class="rt">Use this while you answer</h2>
  <div class="infogrid">
   <div class="infobox"><h3>Organising your answer</h3><p>\u201cThat\u2019s a difficult question.\u201d &middot; \u201cThe one place that I would like to mention is\u2026\u201d</p></div>
   <div class="infobox"><h3>Linking words</h3><p>\u201cI don\u2019t play online games <b>because</b>\u2026\u201d &middot; \u201cWe usually spend our holidays here, <b>so</b>\u2026\u201d</p></div>
   <div class="infobox"><h3>Time expressions</h3><p>\u201c<b>First of all</b>, I\u2026 <b>Then</b> I\u2026 <b>Next</b>, I\u2026\u201d</p></div>
   <div class="infobox"><h3>Range of tenses (use more than one!)</h3><p>\u201cI\u2019ve been to lots of interesting places\u2026 which I visited a few years ago\u2026 I\u2019m actually learning to\u2026 right now\u2026 I think it would be great to\u2026\u201d</p></div>
  </div>
 </div><div class="strip"></div>`);

S.push(`<div class="bg"></div>
 <div class="wm"><span class="w">Somerset</span><span class="lc">LANGUAGE&nbsp;CENTRE</span></div>
 <div class="sc centre"><div class="pill centre">Before next class</div>
 <p class="t-big" style="color:var(--green);font-size:clamp(15px,1.5vw,20px);margin-top:30px">Somerset Language Centre &middot; Val&egrave;ncia</p></div><div class="strip"></div>`);

/* ============ engine (Vista standard) ============ */
const show=document.getElementById('show');
show.innerHTML=S.map((h,i)=>`<div class="slide${i===0?' active':''}">${h}</div>`).join('');
const els=[...document.querySelectorAll('.slide')];let i=0;
function render(){els.forEach((s,k)=>s.classList.toggle('active',k===i));document.getElementById('count').textContent=(i+1)+' / '+els.length;}
function go(d){i=(i+d+els.length)%els.length;render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
show.addEventListener('click',e=>{if(!e.target.closest('#nav'))go(1);});
render();
</script>
</body>
</html>
