    stage.innerHTML=`<div class="pad memory-game"><div id="teamsBox">${Teams.html()}</div>
      <div class="legend"><span class="chip"><span>Turn over two faces. ${this.version==='original'?'Say a true comparative.':this.version==='tf'?'Compare the two pictures: true or false?':'Compare the two pictures.'}</span></span>
      <button class="btn ghost" onclick="Game.memory()"><span>New deal</span></button></div>
      <div class="board" id="bd" style="grid-template-columns:repeat(6,1fr)">${pick.map((c,i)=>`<button class="pc" aria-label="Card ${c.n}" onclick="Game.flipMemory(${i})"><img src="${c.img}" alt=""><span class="tagn">${c.n}</span><span class="back"><span>${c.n}</span></span></button>`).join('')}</div>
      <div class="row" style="display:flex;gap:12px;margin-top:12px"><button class="btn" id="memCorrect" disabled onclick="Game.finishMemory(true)"><span>Correct · +1</span></button><button class="btn hot" id="memPass" disabled onclick="Game.finishMemory(false)"><span>Wrong / pass</span></button></div></div>`;
  },
  flipMemory(i){
    if(this._memSelected.length>=2 || this._memSelected.includes(i)) return;
    this._memSelected.push(i); $$('#bd .pc')[i].classList.add('flip');
    if(this._memSelected.length===2){
      if(this.version==='original'){ $('#memCorrect').disabled=false; $('#memPass').disabled=false; }
      else if(this.version==='tf') this.askMemoryTF();
      else this.askMemoryChoice();
    }
  },
  // Broad visible hair categories checked against cards/01.jpg–24.jpg.
  // Equal categories produce no comparative claim; grey hair has no shade rank.
  pictureTraits:{1:[0,2,0],2:[0,2,1],3:[0,1,0],4:[0,0,0],5:[0,null,0],6:[2,2,0],7:[2,1,0],8:[1,0,0],9:[0,1,2],10:[0,2,2],11:[1,1,2],12:[2,2,2],13:[0,1,2],14:[0,2,2],15:[1,0,2],16:[2,2,2],17:[1,0,0],18:[1,1,0],19:[2,2,0],20:[null,1,null],21:[2,2,2],22:[0,null,0],23:[0,null,0],24:[2,0,1]},
  // Height is not a visual read from a head-and-shoulders photo -- it comes
  // straight from the card's existing Top Trumps stat (stats.height, 1-10),
  // the same number already printed on the physical deck. Shown under the
  // photo below, not inferred, so nobody is guessing an invisible fact.
  pictureStatements(cards){
    const left=this.pictureTraits[cards[0].n],right=this.pictureTraits[cards[1].n];
    if(!left||!right) return [];
    const trueOptions=[],falseOptions=[];
    const dims=[
      {more:'longer',less:'shorter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][0]},
      {more:'darker',less:'lighter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][1]},
      {more:'curlier',less:'straighter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][2]},
      {more:'taller',less:'shorter',tpl:a=>`is ${a}`,val:c=>c.stats&&c.stats.height}
    ];
    dims.forEach(({more,less,tpl,val})=>{
      const lv=val(cards[0]),rv=val(cards[1]);
      if(lv==null||rv==null||lv===rv) return;
      const leftMore=lv>rv;
      for(const side of ['left','right']) for(const adjective of [more,less]){
        const correct=(side==='left' ? leftMore : !leftMore)===(adjective===more);
        (correct?trueOptions:falseOptions).push({text:`The person on the ${side} ${tpl(adjective)}.`,correct});
      }
    });
    if(!trueOptions.length) return [];
    return shuffle([shuffle(trueOptions)[0],...shuffle(falseOptions).slice(0,2)]);
  },
  askMemoryChoice(){
    const cards=this._memSelected.map(i=>this._memCards[i]);
    if(cards.length!==2) return;
    const prompts=[
      ['Who looks happier?', 'looks ___ than', 'happy'],
      ['Who looks older?', 'looks ___ than', 'old'],
      ['Who looks younger?', 'looks ___ than', 'young'],
      ['Who has longer hair?', 'has ___ hair than', 'long'],
      ['Who has shorter hair?', 'has ___ hair than', 'short'],
      ['Who has curlier hair?', 'has ___ hair than', 'curly'],
      ['Who is taller?', 'is ___ than', 'tall'],
      ['Who is shorter?', 'is ___ than', 'short']
    ];
    const prompt=shuffle(prompts)[0], gap=this.version==='gap';
    this._pictureOptions=gap?[]:this.pictureStatements(cards);
    if(!gap && this._pictureOptions.length!==3){
      const last=this._memSelected.pop(); $$('#bd .pc')[last].classList.remove('flip');
      toast('These photos are too similar for a clear question. Choose a different second card.'); return;
    }
    this._pictureChoice=null; this._pictureChecked=false;
    this._cb=ok=>this.finishMemory(ok);
    ov.className='ov on picture-tf';
    ov.innerHTML=`<div class="badge">Turn Two · ${gap?'Fill in':'Multiple choice'}</div>
      <div class="picture-pair">${cards.map((c,i)=>`<figure><img src="${c.img}" alt="${i===0?'Left':'Right'} picture, card ${c.n}"><figcaption>${i===0?'Left':'Right'} · Card ${c.n}<br>Height ${'●'.repeat(Math.round((c.stats&&c.stats.height||0)/2))}${'○'.repeat(5-Math.round((c.stats&&c.stats.height||0)/2))}</figcaption></figure>`).join('')}</div>
      <div class="q">${gap?`The person on the left ${prompt[1]} the person on the right. (${prompt[2]})`:'Which sentence is true?'}</div>
      ${gap?'<p class="picture-hint">Complete the comparative, then decide whether the sentence fits the pictures. Swap left and right if needed.</p>':`<div class="row" style="display:flex;gap:12px;flex-wrap:wrap">${this._pictureOptions.map((option,i)=>`<button class="btn ghost picture-choice" aria-pressed="false" onclick="Game.chooseMemoryAnswer(${i})"><span>${i+1}. ${esc(option.text)}</span></button>`).join('')}</div><p id="pictureSelection" class="picture-hint" aria-live="polite">Choose the one sentence that matches the pictures.</p>`}
      <p class="picture-hint">${gap?'Teacher: accept an answer supported by the pictures.':'One correct answer. Choose a sentence, then check it.'}</p>
      <div class="row" style="display:flex;gap:12px;flex-wrap:wrap"><button id="pictureAccept" class="btn" ${gap?'':'disabled'} onclick="${gap?'Game.resolve(true)':'Game.checkMemoryAnswer()'}"><span>${gap?'Accept answer · +1':'Check answer'}</span></button><button class="btn hot" onclick="Game.resolve(false)"><span>Wrong / pass</span></button></div>`;
  },
  chooseMemoryAnswer(i){
    const labels=this._pictureOptions.map(o=>o.text);
    if(!labels[i] || !$('#pictureSelection')) return;
    this._pictureChoice=i;
    $$('.picture-choice').forEach((b,k)=>{b.setAttribute('aria-pressed',String(i===k)); b.classList.toggle('ghost',i!==k);});
    $('#pictureSelection').textContent='Selected: '+labels[i]+' Choose Check answer when ready.';
    $('#pictureAccept').disabled=false;
  },
  checkMemoryAnswer(){
    if(this._pictureChoice===null || this._pictureChecked) return;
    this._pictureChecked=true;
    const correct=this._pictureOptions[this._pictureChoice].correct;
    $('#pictureSelection').textContent=correct?'Correct! +1 point.':'Not quite. Correct: '+this._pictureOptions.find(o=>o.correct).text;
    $$('.picture-choice').forEach(b=>b.disabled=true);
    $('#pictureAccept').outerHTML=`<button class="btn" onclick="Game.resolve(${correct})"><span>Next turn</span></button>`;
  },
  askMemoryTF(){
    const cards=this._memSelected.map(i=>this._memCards[i]);
    if(cards.length!==2) return;
    const comparisons=['looks happier than','looks older than','looks younger than','has longer hair than','has shorter hair than','has curlier hair than','is taller than','is shorter than'];
    const comparison=shuffle(comparisons)[0];
    this._cb=ok=>this.finishMemory(ok);
    ov.className='ov on picture-tf';
    ov.innerHTML=`<div class="badge">Turn Two · True or false</div>
      <div class="picture-pair">${cards.map((c,i)=>`<figure><img src="${c.img}" alt="${i===0?'Left':'Right'} picture, card ${c.n}"><figcaption>${i===0?'Left':'Right'} · Card ${c.n}<br>Height ${'●'.repeat(Math.round((c.stats&&c.stats.height||0)/2))}${'○'.repeat(5-Math.round((c.stats&&c.stats.height||0)/2))}</figcaption></figure>`).join('')}</div>
      <div class="q">The person on the left ${esc(comparison)} the person on the right.</div>
      <div class="row" style="display:flex;gap:12px"><span class="chip"><span>True</span></span><span class="chip"><span>False</span></span></div>
      <p class="picture-hint">Say true or false. If false, correct the sentence. Teacher: judge from the pictures and accept a reasonable explanation.</p>
      <div class="row" style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" onclick="Game.resolve(true)"><span>Accept answer · +1</span></button><button class="btn hot" onclick="Game.resolve(false)"><span>Wrong / pass</span></button></div>`;
  },
  finishMemory(ok){
    if(this._memSelected.length!==2) return;
    if(ok) Teams.add(1);
    $$('#bd .pc').forEach(c=>c.classList.remove('flip'));
    this._memSelected=[]; $('#memCorrect').disabled=true; $('#memPass').disabled=true; Teams.next();
  },

  /* ---- 3 · GUESS WHO ---- */
  guessWho(){
    const cs=this.unit.cards;
    const secret=cs[Math.random()*cs.length|0];
    this._secret=secret;
    stage.innerHTML = `<div class="pad">
      <div class="legend">
        <span class="chip"><span>Ask <b>yes / no</b> questions only</span></span>
        <span class="chip"><span>Click a face to cross it out</span></span>
        <button class="btn ghost" onclick="Game.peek()"><span>👁 Teacher peek</span></button>
        <button class="btn ghost" onclick="Game.reveal()"><span>Reveal</span></button>
        <button class="btn" onclick="Game.guessWho()"><span>New game</span></button></div>
      <div class="board" style="grid-template-columns:repeat(8,1fr)">
        ${cs.map((c,i)=>`<button class="pc flip" style="--i:${i}" onclick="this.classList.toggle('out')">
            <img src="${c.img}" alt=""><span class="tagn">${c.n}</span></button>`).join('')}
      </div></div>`;
    /* the secret is NOT announced — it used to be toasted on the projector,
       where the whole class could read it. Teacher presses Peek. */
  },
  peek(){
    const s=this._secret; if(!s) return;
    toast('Secret card: number '+s.n, 1400);
  },
  reveal(){ const s=this._secret;
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">The secret card was</div>
      <div class="q">Number ${s.n}</div>
      <div class="a on">${esc(s.hair)} · ${esc(s.colour)} · ${s.glasses?'glasses':'no glasses'} · ${s.tall?'tall':'short'}</div>
      <div class="row"><button class="btn" onclick="ov.classList.remove('on')"><span>Close</span></button></div>`;
  },

  /* ---- 4 · SPEED ROUND ---- */
  speed(){
    const words=shuffle(this.unit.vocab);let i=0;
    Teams.init(2);
    /* the Spanish stays hidden until the teacher shows it — otherwise
       the answer is on the board before anybody has tried */
    const show=()=>{ const w=words[i%words.length];
      $('#spw').innerHTML=`<div class="q">${esc(w.w)}</div>
        <div class="a" id="spa">${esc(w.t)}</div>`; };
    stage.innerHTML=`<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px" id="spw"></div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" onclick="$('#spa').classList.add('on')"><span>Show Spanish</span></button>
        <button class="btn" onclick="Teams.add(1);Game._sp()"><span>✔ Got it (+1)</span></button>
        <button class="btn ghost" onclick="Game._sp()"><span>Skip ▶</span></button>
        <button class="btn ghost" onclick="Teams.next()"><span>↻ Next team</span></button>
        <button class="btn hot" onclick="timer(60)"><span>▶ 60 seconds</span></button>
      </div></div>`;
    this._sp=()=>{i++;show();}; show();
  },

  /* ---- 5 · WORD FLASH ---- */
  flash(){
    const words=shuffle(this.unit.vocab);let i=0;
    const show=()=>{const w=words[i%words.length];
      stage.innerHTML=`<div class="pad" style="align-items:center;justify-content:center;text-align:center;gap:20px">
        <div class="sub" style="margin:0">Word ${i+1} / ${words.length}</div>
        <div style="font-family:var(--sans);font-weight:700;font-size:clamp(46px,11vw,180px);line-height:1">${esc(w.w)}</div>
        <div class="row" style="display:flex;gap:12px">
          <button class="btn ghost" onclick="Game._fl(-1)"><span>◀</span></button>
          <button class="btn" onclick="Game._fl(1)"><span>Next ▶</span></button>
        </div></div>`;};
    this._fl=d=>{i=(i+d+words.length)%words.length;show();}; show();
  },

  /* ---- 6 · HANGMAN ----
     The sixth mechanic: letter-by-letter reveal. It is the only game in
     here that drills SPELLING, which is where Spanish speakers lose marks
     in Use of English — embarrassment, misophonia, frustration.
     Two rules keep it from being the weak version of hangman:
       1. the clue is the Spanish, so it is vocabulary recall, not roulette;
       2. finishing the word does not score. The team then has to USE it,
          and Hugo marks that — same rule as every other game here. */
  hangmanWords(){
    return (this.unit.vocab||[]).map(v=>{
      let w=String(v.w).split('/')[0].replace(/\([^)]*\)/g,'').trim();
      w=w.replace(/^to\s+/i,'').trim();
      return {w:w.toUpperCase(), t:v.t, full:v.w};
    }).filter(v=>(v.w.match(/[A-ZÁÉÍÓÚÑ]/g)||[]).length>=4);
  },
  hangman(){
    const pool=this.hangmanWords();
    if(!pool.length){ stage.innerHTML='<div class="pad"><h1 class="h1">No words long enough</h1><p class="sub">This unit needs vocabulary of four letters or more.</p><div class="row"><button class="btn ghost" onclick="Game.home()"><span>Back</span></button></div></div>'; return; }
    Teams.init(2);
    this._hmPool=shuffle(pool); this._hmI=0;
    this.hangmanDeal();
  },
  hangmanDeal(){
    const pick=this._hmPool[this._hmI % this._hmPool.length]; this._hmI++;
    this._hm={word:pick.w, clue:pick.t, full:pick.full, got:new Set(), miss:new Set()};
    this.hangmanDraw();
  },
  hangmanSlots(){
    const h=this._hm;
    return [...h.word].map(ch=>{
      if(!/[A-ZÁÉÍÓÚÑ]/.test(ch)) return `<span class="hmslot free">${ch===' '?'&nbsp;':esc(ch)}</span>`;
      return `<span class="hmslot">${h.got.has(ch)?esc(ch):''}</span>`;
    }).join('');
  },
  hangmanWon(){ const h=this._hm; return [...h.word].every(ch=>!/[A-ZÁÉÍÓÚÑ]/.test(ch)||h.got.has(ch)); },
  hangmanDraw(){
    /* any round-end panel belongs to the previous word — clear it before
       repainting, or the board is live underneath a stale overlay */
    ov.classList.remove('on');
    const h=this._hm, miss=h.miss.size, lost=miss>=6;
    const part=n=>miss>=n?'':' style="display:none"';
    stage.innerHTML=`<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div class="hmwrap">
        <svg class="hmfig" viewBox="0 0 180 200" aria-hidden="true">
          <g stroke="var(--green)" stroke-width="7" stroke-linecap="round" fill="none">
            <line x1="14" y1="192" x2="104" y2="192"${part(1)}/>
            <line x1="44" y1="192" x2="44" y2="12"${part(2)}/>
            <line x1="44" y1="12" x2="126" y2="12"${part(3)}/>
            <line x1="126" y1="12" x2="126" y2="40"${part(4)}/>
          </g>
          <g stroke="var(--hot)" stroke-width="7" stroke-linecap="round" fill="none">
            <circle cx="126" cy="58" r="18"${part(5)}/>
            <g${part(6)}>
              <line x1="126" y1="76" x2="126" y2="128"/>
              <line x1="126" y1="92" x2="104" y2="114"/>
              <line x1="126" y1="92" x2="148" y2="114"/>
              <line x1="126" y1="128" x2="106" y2="160"/>
              <line x1="126" y1="128" x2="146" y2="160"/>
            </g>
          </g>
        </svg>
        <div class="hmright">
          <div class="hmclue"><span class="chip"><span>Clue · español</span></span>
            <div class="hmclueword">${esc(h.clue)}</div></div>
          <div class="hmword">${this.hangmanSlots()}</div>
          <div class="hmlives">${'●'.repeat(6-miss)}<span class="gone">${'●'.repeat(miss)}</span>
            <span class="hmlivestxt">${6-miss} left</span></div>
          <div class="hmkeys">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>{
            const used=h.got.has(L)||h.miss.has(L);
            return `<button class="hmkey${h.got.has(L)?' hit':h.miss.has(L)?' miss':''}"${used||lost?' disabled':''}
              onclick="Game.hangmanGuess('${L}')">${L}</button>`;}).join('')}</div>
        </div>
      </div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        <button class="btn ghost" onclick="Game.hangmanDeal()"><span>New word ▶</span></button>
        <button class="btn ghost" onclick="Teams.next();Game.hangmanDraw()"><span>↻ Next team</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button>
      </div></div>`;
    if(this.hangmanWon()) this.hangmanEnd(true);
    else if(lost) this.hangmanEnd(false);
  },
  hangmanGuess(L){
    const h=this._hm; if(!h||h.miss.size>=6||this.hangmanWon()) return;
    if(h.got.has(L)||h.miss.has(L)) return;
    if(h.word.includes(L)){ h.got.add(L); }
    else { h.miss.add(L); Teams.next(); }
    this.hangmanDraw();
  },
  /* Finishing the word wins nothing on its own. The team says it in a
     sentence and the teacher decides — the Arcade never auto-scores. */
  hangmanEnd(won){
    const h=this._hm;
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">${won?'Word complete':'Six wrong letters'}</div>
      <div class="worth ${won?'':'steal'}">${won?'Now use it — 2 points':'The word was'}</div>
      <div class="q">${esc(h.full)}</div>
      <div class="a on">${esc(h.clue)}</div>
      ${won?'<p class="sub">Say a full sentence with the word. You decide if it counts.</p>':''}
      <div class="row">
        ${won?`<button class="btn" onclick="Teams.add(2);Game.hangmanAfter()"><span>✔ Good sentence · +2</span></button>
        <button class="btn hot" onclick="Game.hangmanAfter()"><span>✘ No points</span></button>`
        :`<button class="btn" onclick="Game.hangmanAfter()"><span>Next word ▶</span></button>`}
      </div>`;
  },
  hangmanAfter(){ ov.classList.remove('on'); Teams.next(); this.hangmanDeal(); },

  /* ================================================================
     BINGO (added 6 Oct 2026)
     Modelled on Baamboozle's Bingo, which is not a board game at all:
     it is a CALLER. Every child holds their own paper card, the board
     shows one clue at a time in random order, and everybody plays at
     once. That is the whole design, and it is why it works with
     children: nobody waits for a turn, nobody is put on the spot, and
     the card decides how hard it is (find the word you can read).

     Somerset changes, all deliberate:
       - cards are PRINTED here, one different card per child, black
         and white, so nobody has to copy nine words first;
         "word bank on the board" keeps Baamboozle's write-your-own
         version for a writing minute;
       - the clue is the Spanish by default, so it is recall;
       - the board never decides a winner. A child shouts Bingo, the
         teacher checks the called list. Same rule as every game here:
         the Arcade does not mark anything.
     Reads only the unit's `vocab` array, so every unit gets it free. */
  bingoWords(){
    const seen=new Set();
    return (this.unit.vocab||[]).map(v=>({
      w:String(v.w).split('/')[0].replace(/\([^)]*\)/g,'').replace(/^to\s+/i,'').replace(/\s+/g,' ').trim(),
      t:String(v.t||'').trim()
    })).filter(v=>v.w&&v.t&&v.w.length<=20&&!seen.has(v.w.toLowerCase())&&seen.add(v.w.toLowerCase()));
  },
  bingoOn(){ return this._bg.pool.filter(p=>p.on); },
  bingoWinLabel(){ return {line:'one line',corners:'four corners',full:'the full card'}[this._bg.win]; },
  bingo(){
    this._bg={pool:this.bingoWords().map(v=>({...v,on:true})),size:3,clue:'es',win:'line',cards:12,order:[],i:0,shown:false};
    this.bingoSetup();
  },
  bingoSet(k,v){ this._bg[k]=v; this.bingoSetup(); },
  bingoToggle(i){ const p=this._bg.pool[i]; p.on=!p.on; this.bingoSetup(); },
  bingoCards(d){ const b=this._bg; b.cards=Math.max(1,Math.min(40,b.cards+d)); this.bingoSetup(); },
  bingoSetup(){
    stopTimer(); ov.classList.remove('on');
    const b=this._bg, n=b.size*b.size, on=this.bingoOn().length;
    const opt=(label,cur,val,fn)=>`<button class="bgopt${cur===val?' sel':''}" onclick="${fn}"><span>${label}</span></button>`;
    const msg = on<n ? `Pick at least ${n} words for a ${b.size} by ${b.size} card.`
              : on<n+3 ? `${on} words selected. Few words means many cards will look alike. Add more if you can.`
              : `${on} words selected.`;
    stage.innerHTML=`<div class="pad"><h1 class="h1">Bingo</h1>
      <p class="sub">Everyone plays at once. Each child has their own card. You call, they cover.</p>
      <div class="bgset">
        <div class="bgrow"><span class="bglab">Card</span>${opt('3 by 3',b.size,3,"Game.bingoSet('size',3)")}${opt('4 by 4',b.size,4,"Game.bingoSet('size',4)")}</div>
        <div class="bgrow"><span class="bglab">Clue on the board</span>${opt('Spanish',b.clue,'es',"Game.bingoSet('clue','es')")}${opt('English',b.clue,'en',"Game.bingoSet('clue','en')")}</div>
        <div class="bgrow"><span class="bglab">Win with</span>${opt('One line',b.win,'line',"Game.bingoSet('win','line')")}${opt('Four corners',b.win,'corners',"Game.bingoSet('win','corners')")}${opt('Full card',b.win,'full',"Game.bingoSet('win','full')")}</div>
        <div class="bgrow"><span class="bglab">Word bank</span><span class="bgnote">Tap a word to take it out.</span></div>
        <div class="bgbank">${b.pool.map((p,i)=>`<button class="bgw${p.on?' on':''}" onclick="Game.bingoToggle(${i})">${esc(p.w)}</button>`).join('')}</div>
        <p class="bgwarn">${esc(msg)}</p>
      </div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px">
        <button class="btn ghost" onclick="Game.bingoCards(-1)"><span>−</span></button>
        <span class="chip"><span><b>${b.cards}</b> cards</span></span>
        <button class="btn ghost" onclick="Game.bingoCards(1)"><span>+</span></button>
        <button class="btn" ${on<n?'disabled':''} onclick="Game.bingoPrint(false)"><span>🖨 Print cards</span></button>
        <button class="btn ghost" onclick="Game.bingoPrint(true)"><span>Print blank cards</span></button>
        <button class="btn ghost" ${on<n?'disabled':''} onclick="Game.bingoBank()"><span>Word bank on the board</span></button>
        <button class="btn hot" ${on<n?'disabled':''} onclick="Game.bingoStart()"><span>Start calling ▶</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button>
      </div></div>`;
  },
  /* the Baamboozle way: put the words on the board, the children write
     their own card. Costs five minutes, buys a writing task. */
  bingoBank(){
    const b=this._bg, on=this.bingoOn();
    stage.innerHTML=`<div class="pad"><h1 class="h1">Choose ${b.size*b.size} words</h1>
      <p class="sub">Copy ${b.size*b.size} of these onto your card. Any ${b.size*b.size} you like.</p>
      <div class="bgbig">${on.map(p=>`<div><b>${esc(p.w)}</b><small>${esc(p.t)}</small></div>`).join('')}</div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        <button class="btn ghost" onclick="Game.bingoSetup()"><span>Back</span></button>
        <button class="btn hot" onclick="Game.bingoStart()"><span>Start calling ▶</span></button></div></div>`;
  },
  bingoCardHTML(words,size,blank){
    const rows=[]; for(let r=0;r<size;r++){
      rows.push('<tr>'+words.slice(r*size,r*size+size).map(w=>`<td>${blank?'':esc(w)}</td>`).join('')+'</tr>'); }
    return `<section class="bgcard"><h4>Somerset Language Centre · Bingo</h4>
      <p class="bgmeta">${esc(this.unit.title)} · win with ${this.bingoWinLabel()}</p>
      <p class="bgname">Name: ______________________</p>
      <table>${rows.join('')}</table></section>`;
  },
  /* prints through a hidden #printArea (no popup, works from file://).
     Black and white, outlines only, nothing that needs colour. */
  bingoPrint(blank){
    const b=this._bg, n=b.size*b.size, sel=this.bingoOn();
    if(!blank&&sel.length<n) return;
    let pa=document.getElementById('printArea');
    if(!pa){ pa=document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
    const cards=[]; for(let k=0;k<b.cards;k++){
      const words=blank?Array(n).fill(''):shuffle(sel.slice()).slice(0,n).map(p=>p.w);
      cards.push(this.bingoCardHTML(words,b.size,blank)); }
    const per=b.size===3?3:2, pages=[];
    for(let i=0;i<cards.length;i+=per) pages.push(`<div class="bgpage">${cards.slice(i,i+per).join('')}</div>`);
    pa.className='p'+b.size; pa.innerHTML=pages.join('');
    setTimeout(()=>window.print(),60);
  },
  bingoStart(){
    const b=this._bg, on=this.bingoOn(); if(on.length<b.size*b.size) return;
    b.order=shuffle(on.slice()); b.i=0; b.shown=false; this.bingoDraw();
  },
  bingoDraw(){
    ov.classList.remove('on');
    const b=this._bg, cur=b.order[b.i], total=b.order.length;
    const clue=b.clue==='es'?cur.t:cur.w, ans=b.clue==='es'?cur.w:cur.t;
    stage.innerHTML=`<div class="pad"><div class="legend">
        <span class="chip"><span>Call <b>${b.i+1}</b> of ${total}</span></span>
        <span class="chip"><span>Win with <b>${this.bingoWinLabel()}</b></span></span></div>
      <div class="bgcall"><div class="bgclue">${esc(clue)}</div>
        ${b.shown?`<div class="bgans">${esc(ans)}</div>`
                 :`<button class="btn hot" onclick="Game.bingoReveal()"><span>Show the answer (R)</span></button>`}</div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        <button class="btn ghost" ${b.i===0?'disabled':''} onclick="Game.bingoStep(-1)"><span>◀ Previous</span></button>
        <button class="btn" onclick="Game.bingoStep(1)"><span>${b.i+1>=total?'Last word done':'Next call ▶'}</span></button>
        <button class="btn ghost" onclick="Game.bingoCheck()"><span>✔ Check a Bingo (B)</span></button>
        <button class="btn ghost" onclick="Game.bingoSetup()"><span>Setup</span></button></div></div>`;
  },
  bingoReveal(){ const b=this._bg; if(!b||b.shown) return; b.shown=true; this.bingoDraw(); },
  bingoStep(d){
    const b=this._bg, j=b.i+d; if(j<0) return;
    if(j>=b.order.length){ this.bingoEnd('all'); return; }
    b.i=j; b.shown=false; this.bingoDraw();
  },
  /* a child shouts Bingo: the teacher checks the card against what has
     actually been called. The board never decides. */
  bingoCheck(){
    const b=this._bg, called=b.order.slice(0,b.i+1);
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">Check the card</div>
      <div class="worth">${called.length} called so far</div>
      <p class="sub">Win with ${this.bingoWinLabel()}. Every word on that line must be here.</p>
      <div class="bgcalled">${called.map(p=>`<span>${esc(p.w)}</span>`).join('')}</div>
      <div class="row"><button class="btn" onclick="Game.bingoEnd('win')"><span>✔ Bingo</span></button>
        <button class="btn hot" onclick="ov.classList.remove('on')"><span>✘ Not yet, keep going</span></button></div>`;
  },
  bingoEnd(kind){
    const win=kind==='win';
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">${win?'Bingo':'Every word called'}</div>
      <div class="worth ${win?'':'steal'}">${win?'Well played':'No more words'}</div>
      <p class="sub">${win?'Check the card, then play another round.':'Shuffle and go again, or change the words.'}</p>
      <div class="row"><button class="btn" onclick="Game.bingoStart()"><span>Play again ▶</span></button>
        <button class="btn ghost" onclick="Game.bingoSetup()"><span>Change words</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button></div>`;
    if(win) this.bingoConfetti();
  },
  bingoConfetti(){
    const c=document.createElement('div'); c.className='bgconf'; const cols=['#6BAE2E','#E2542C','#E8A020','#ffffff'];
    c.innerHTML=Array.from({length:48},(_,k)=>`<i style="left:${Math.random()*100}%;background:${cols[k%4]};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.4}s"></i>`).join('');
    document.body.appendChild(c); setTimeout(()=>c.remove(),3600);
  },

  /* ================================================================
     DOUBLE VISION (added 6 Oct 2026)
     Baamboozle's Double Vision is Dobble on a projector: two discs of
     pictures, exactly one picture is on both, the whole class races to
     spot it. Hugo asked for it as THE revision game for any exercise
     that has images (the October vegetables first).

     What carries over: the two-disc race, the "knobs" (pictures per
     disc, pictures or words on the second disc), a points target, the
     teacher clicking the tile the winner points at.
     Somerset changes, all deliberate:
       - the winner must SAY it in English before the point is given:
         the picture race becomes a speaking task, not just a look;
       - the teacher decides the point (same rule as every game here,
         nothing scores by itself). Clicking the right tile only
         confirms the match; the +1 is a team button you press;
       - the match rotates through every selected picture before any
         repeats, so a revision round covers the whole set evenly;
       - look-alike pictures never share a round (a `clash` tag on the
         picture), otherwise a child "finds" a match that is not one;
       - words on the second disc are never rotated or skewed.
     Reads the unit's `pics` array: [{id,w,t,img,clash?}]. A unit with
     fewer than nine pictures does not show the tile. */
  dvPics(){ return (this.unit.pics||[]).map((p,i)=>({...p,id:p.id||('p'+i)})); },
  doubleVision(){
    this._dv={pool:this.dvPics().map(p=>({...p,on:true})),n:4,mode:'pics',spin:false,target:5,
      pts:[],queue:[],cur:null,locked:false};
    this.dvSetup();
  },
  dvOn(){ return this._dv.pool.filter(p=>p.on); },
  dvSet(k,v){ this._dv[k]=v; this.dvSetup(); },
  dvToggle(i){ const p=this._dv.pool[i]; p.on=!p.on; this.dvSetup(); },
  dvSetup(){
    stopTimer(); ov.classList.remove('on');
    const d=this._dv, need=2*d.n-1, on=this.dvOn().length;
    const opt=(label,cur,val,fn)=>`<button class="bgopt${cur===val?' sel':''}" onclick="${fn}"><span>${label}</span></button>`;
    const msg=on<need?`Pick at least ${need} pictures for ${d.n} on a disc.`:`${on} pictures selected.`;
    stage.innerHTML=`<div class="pad"><h1 class="h1">Double Vision</h1>
      <p class="sub">Two discs. One picture is on both. First to spot it and say it in English wins the round.</p>
      <div class="bgset">
        <div class="bgrow"><span class="bglab">On each disc</span>${[3,4,5,6].map(n=>opt(n+' pictures',d.n,n,`Game.dvSet('n',${n})`)).join('')}</div>
        <div class="bgrow"><span class="bglab">Second disc</span>${opt('Pictures',d.mode,'pics',"Game.dvSet('mode','pics')")}${opt('Words',d.mode,'words',"Game.dvSet('mode','words')")}</div>
        <div class="bgrow"><span class="bglab">Pictures spin</span>${opt('Off',d.spin,false,"Game.dvSet('spin',false)")}${opt('On',d.spin,true,"Game.dvSet('spin',true)")}</div>
        <div class="bgrow"><span class="bglab">First to</span>${[3,5,8].map(n=>opt(n+' points',d.target,n,`Game.dvSet('target',${n})`)).join('')}${opt('No limit',d.target,0,"Game.dvSet('target',0)")}</div>
        <div class="bgrow"><span class="bglab">Pictures in play</span><span class="bgnote">Tap one to take it out.</span></div>
        <div class="dvchips">${d.pool.map((p,i)=>`<button class="dvchip${p.on?' on':''}" onclick="Game.dvToggle(${i})"><img src="${esc(p.img)}" alt=""><span>${esc(p.w)}</span></button>`).join('')}</div>
        <p class="bgwarn">${esc(msg)}</p>
      </div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px">
        <button class="btn hot" ${on<need?'disabled':''} onclick="Game.dvStart()"><span>Start ▶</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button></div></div>`;
  },
  dvStart(){
    const d=this._dv; if(this.dvOn().length<2*d.n-1) return;
    Teams.init(2); d.pts=Teams.list.map(()=>0); d.queue=[]; this.dvDeal();
  },
  /* one round: A and B share exactly one picture. At most one picture
     per clash tag in the whole round. The match walks through every
     selected picture before it repeats. */
  dvBuild(){
    const d=this._dv, n=d.n, sel=this.dvOn();
    if(!d.queue.length) d.queue=shuffle(sel.map(p=>p.id));
    const mid=d.queue.pop(), match=sel.find(p=>p.id===mid);
    const used=new Set(match.clash?[match.clash]:[]), picked=[], rest=shuffle(sel.filter(p=>p.id!==mid));
    for(const p of rest){ if(picked.length>=2*(n-1)) break;
      if(p.clash){ if(used.has(p.clash)) continue; used.add(p.clash); } picked.push(p); }
    for(const p of rest){ if(picked.length>=2*(n-1)) break; if(!picked.includes(p)) picked.push(p); }
    return {match, A:shuffle([match,...picked.slice(0,n-1)]), B:shuffle([match,...picked.slice(n-1,2*(n-1))])};
  },
  dvLayout(n){
    const out=[], off=Math.random()*Math.PI*2, ring=n>=5?n-1:n, rr=n>=5?0.33:0.28;
    const t=n>=5?Math.min(0.30,2*rr*Math.sin(Math.PI/ring)*0.92):Math.min(0.40,2*rr*Math.sin(Math.PI/ring)*0.95);
    if(n>=5) out.push({x:.5,y:.5,s:.30});
    for(let k=0;k<ring;k++){ const a=off+k*2*Math.PI/ring; out.push({x:.5+rr*Math.cos(a),y:.5+rr*Math.sin(a),s:t}); }
    return shuffle(out);
  },
  dvDisc(side,items,kind){
    const d=this._dv, lay=this.dvLayout(items.length);
    return `<div class="dvdisc ${side}">${items.map((it,i)=>{
      const L=lay[i], rot=(kind==='pic'&&d.spin)?Math.floor(Math.random()*360):0;
      return `<button class="dvt ${kind}" data-side="${side}" data-id="${esc(it.id)}"
        style="left:${(L.x*100).toFixed(1)}%;top:${(L.y*100).toFixed(1)}%;width:${(L.s*100).toFixed(1)}%;height:${(L.s*100).toFixed(1)}%;--rot:${rot}deg"
        onclick="Game.dvPick('${side}','${esc(it.id)}')">${kind==='pic'?`<img src="${esc(it.img)}" alt="">`:`<span>${esc(it.w)}</span>`}</button>`;
    }).join('')}</div>`;
  },
  dvDeal(){
    ov.classList.remove('on');
    const d=this._dv; d.locked=false; d.cur=this.dvBuild();
    stage.innerHTML=`<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div class="legend"><span class="chip"><span>First to <b>${d.target||'no limit'}</b></span></span>
        <span class="chip"><span>${d.pts.map((p,i)=>esc(Teams.list[i].name)+' <b>'+p+'</b>').join(' · ')}</span></span></div>
      <div class="dvboard">${this.dvDisc('A',d.cur.A,'pic')}${this.dvDisc('B',d.cur.B,d.mode==='words'?'word':'pic')}</div>
      <div id="dvhint" class="dvhint"></div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn ghost" onclick="Game.dvKnob('n',-1)"><span>− Fewer</span></button>
        <button class="btn ghost" onclick="Game.dvKnob('n',1)"><span>More +</span></button>
        <button class="btn ghost" onclick="Game.dvKnob('mode')"><span>${d.mode==='words'?'Pictures on both':'Words on the right'}</span></button>
        <button class="btn" onclick="Game.dvReveal()"><span>Show the match (R)</span></button>
        <button class="btn hot" onclick="Game.dvDeal()"><span>New round ▶</span></button>
        <button class="btn ghost" onclick="Game.dvSetup()"><span>Setup</span></button></div></div>`;
  },
  dvKnob(k,delta){
    const d=this._dv;
    if(k==='n'){ const n=Math.max(3,Math.min(6,d.n+delta));
      if(this.dvOn().length<2*n-1){ toast('Not enough pictures for '+n+' on a disc.'); return; }
      d.n=n; d.queue=[]; }
    else d.mode=d.mode==='words'?'pics':'words';
    this.dvDeal();
  },
  /* the teacher taps the tile the child points at. Right tile = the
     match is confirmed; wrong tile = it greys out and play carries on. */
  dvPick(side,id){
    const d=this._dv; if(!d||!d.cur||d.locked) return;
    if(id===d.cur.match.id){ this.dvFound(); return; }
    const el=stage.querySelector(`.dvt[data-side="${side}"][data-id="${id}"]`); if(el) el.classList.add('no');
  },
  dvHilite(){ stage.querySelectorAll(`.dvt[data-id="${this._dv.cur.match.id}"]`).forEach(e=>e.classList.add('hit')); },
  dvReveal(){
    const d=this._dv; if(!d||!d.cur||d.locked) return;
    this.dvHilite(); const h=$('#dvhint'); if(h) h.textContent='The match: '+d.cur.match.w+' · '+d.cur.match.t;
  },
  dvFound(){
    const d=this._dv, m=d.cur.match; d.locked=true; this.dvHilite();
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">Found it</div>
      <img class="dvwin" src="${esc(m.img)}" alt="">
      <div class="worth">Say it in English</div>
      <div class="q">${esc(m.w)}</div><div class="a on">${esc(m.t)}</div>
      <p class="sub">Who spotted it first? You decide if the word was said.</p>
      <div class="row">${Teams.list.map((t,i)=>`<button class="btn" onclick="Game.dvAward(${i})"><span>${esc(t.name)} +1</span></button>`).join('')}

  },
  dvAward(i){
    const d=this._dv; ov.classList.remove('on');
    if(i>=0){ d.pts[i]++; Teams.turn=i; Teams.add(1);

    this.dvDeal();
  },
  dvWin(i){
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">Round over</div><div class="worth">${esc(Teams.list[i].name)} win</div>
      <p class="sub">First to ${this._dv.target}. Play another match, or change the pictures.</p>
      <div class="row"><button class="btn" onclick="Game.dvStart()"><span>Play again ▶</span></button>
        <button class="btn ghost" onclick="Game.dvSetup()"><span>Setup</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button></div>`;
    this.bingoConfetti();
  },

  /* ================================================================
     BOXES: Baamboozle's Boxes mode, which is dots and boxes.
     Teams take turns. Say the word in English and you may draw one
     line. Close the fourth side of a box and it is yours, and you go
     again. Whoever owns most boxes wins. The teacher presses
     "Said it" or "Not yet"; nothing is scored by the screen.
     Works with pictures (unit.pics) or with the Spanish clue (vocab).
     ================================================================ */
  bxItems(){
    const seen=new Map();
    (this.unit.vocab||[]).forEach(v=>{ if(v&&v.w) seen.set(v.w.toLowerCase(),{id:'v'+seen.size,w:v.w,t:v.t||''}); });
    this.dvPics().forEach(p=>{ const k=String(p.w).toLowerCase(), cur=seen.get(k);
      if(cur) cur.img=p.img; else seen.set(k,{id:'v'+seen.size,w:p.w,t:p.t||'',img:p.img}); });
    return [...seen.values()];
  },
  boxes(){
    const pool=this.bxItems().map(x=>({...x,on:true})), pics=pool.filter(x=>x.img).length>=6;
    this._bx={pool,size:3,mode:pics?'pic':'es',hasPics:pics,queue:[],last:null,cur:null,hist:[]};
    this.bxSetup();
  },
  bxOn(){ const d=this._bx; return d.pool.filter(x=>x.on&&(d.mode!=='pic'||x.img)); },
  bxSet(k,v){ this._bx[k]=v; this.bxSetup(); },
  bxToggle(i){ const p=this._bx.pool[i]; p.on=!p.on; this.bxSetup(); },
  bxSetup(){
    stopTimer(); ov.classList.remove('on');
    const d=this._bx, on=this.bxOn().length;
    const opt=(label,cur,val,fn)=>`<button class="bgopt${cur===val?' sel':''}" onclick="${fn}"><span>${label}</span></button>`;
    const chips=d.pool.map((p,i)=>({p,i})).filter(x=>d.mode!=='pic'||x.p.img);
    stage.innerHTML=`<div class="pad"><h1 class="h1">Boxes</h1>
      <p class="sub">Say the word in English to draw a line. Close a box and it is yours, and you go again. Most boxes wins.</p>
      <div class="bgset">
        <div class="bgrow"><span class="bglab">Board</span>${opt('3 × 3 boxes · quick',d.size,3,"Game.bxSet('size',3)")}${opt('4 × 4 boxes · longer',d.size,4,"Game.bxSet('size',4)")}</div>
        <div class="bgrow"><span class="bglab">The clue is</span>${d.hasPics?opt('A picture',d.mode,'pic',"Game.bxSet('mode','pic')"):''}${opt('The Spanish word',d.mode,'es',"Game.bxSet('mode','es')")}</div>
        <div class="bgrow"><span class="bglab">Words in play</span><span class="bgnote">Tap one to take it out.</span></div>
        <div class="dvchips">${chips.map(x=>`<button class="dvchip${x.p.on?' on':''}" onclick="Game.bxToggle(${x.i})">${x.p.img&&d.mode==='pic'?`<img src="${esc(x.p.img)}" alt="">`:''}<span>${esc(x.p.w)}</span></button>`).join('')}</div>
        <p class="bgwarn">${on<6?'Pick at least 6 words.':on+' words selected. Every word comes up before any repeats.'}</p>
      </div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px">
        <button class="btn hot" ${on<6?'disabled':''} onclick="Game.bxStart()"><span>Start ▶</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button></div></div>`;
  },
  bxStart(){
    const d=this._bx; if(this.bxOn().length<6) return;
    Teams.init(3); const n=Math.min(Teams.list.length,6), R=d.size;
    Object.assign(d,{R,C:R,n,t:0,phase:'ask',h:Array((R+1)*R).fill(-1),v:Array(R*(R+1)).fill(-1),
      box:Array(R*R).fill(-1),pts:Array(n).fill(0),queue:[],last:null,hist:[],msg:''});
    this.bxNext(); this.bxDraw();
  },
  bxNext(){
    const d=this._bx;
    if(!d.queue.length){ d.queue=shuffle(this.bxOn().map(x=>x.id));
      if(d.queue.length>1&&d.cur&&d.queue[d.queue.length-1]===d.cur.id) d.queue.unshift(d.queue.pop()); }
    const id=d.queue.pop(); d.cur=this.bxOn().find(x=>x.id===id);
  },
  bxCols(){ return ['#6BAE2E','#E2542C','#E8A020','#3A8FA3','#B07CC6','#F7F3EA']; },
  bxLetter(i){ return 'ABCDEF'[i]; },
  bxSvg(){
    const d=this._bx, R=d.R, C=d.C, S=100, P=44, W=C*S+2*P, H=R*S+2*P, cols=this.bxCols();
    let s=`<svg viewBox="0 0 ${W} ${H}" class="bxsvg" role="img" aria-label="Dots and boxes board">`;
    for(let i=0;i<R;i++) for(let j=0;j<C;j++){ const o=d.box[i*C+j]; if(o<0) continue;
      const x=P+j*S, y=P+i*S;
      s+=`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${cols[o]}" opacity=".4"/><text x="${x+S/2}" y="${y+S/2}" class="bxl">${this.bxLetter(o)}</text>`; }
    const line=(t,i,j)=>{
      const own=t==='h'?d.h[i*C+j]:d.v[i*(C+1)+j], x1=P+j*S, y1=P+i*S, x2=t==='h'?x1+S:x1, y2=t==='h'?y1:y1+S;
      const a=`x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"`;
      return `<line ${a} class="bxln${own>=0?' own':''}"${own>=0?` style="stroke:${cols[own]}"`:''}/>`
        +((d.phase==='draw'&&own<0)?`<line ${a} class="bxhit" data-k="${t}${i}-${j}" onclick="Game.bxLine('${t}',${i},${j})"/>`:''); };
    for(let i=0;i<=R;i++) for(let j=0;j<C;j++) s+=line('h',i,j);
    for(let i=0;i<R;i++) for(let j=0;j<=C;j++) s+=line('v',i,j);
    for(let i=0;i<=R;i++) for(let j=0;j<=C;j++) s+=`<circle class="bxdot" cx="${P+j*S}" cy="${P+i*S}" r="9"/>`;
    return s+'</svg>';
  },
  bxDraw(){
    ov.classList.remove('on');
    const d=this._bx, cols=this.bxCols(), cur=d.cur, name=Teams.list[d.t].name;
    Teams.turn=d.t;
    const clue = d.mode==='pic'
      ? `<img class="bxpic" src="${esc(cur.img)}" alt="">`
      : `<div class="bxclue">${esc(cur.t)}</div>`;
    let panel;
    if(d.phase==='ask'){
      panel=`<div class="bxturn" style="--tc:${cols[d.t]}"><b>${this.bxLetter(d.t)}</b> ${esc(name)}</div>
        ${d.msg?`<div class="bxmsg">${esc(d.msg)}</div>`:''}
        <div class="bxsay">Say it in English</div>${clue}
        <div class="bxword" id="bxword"></div>
        <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn" onclick="Game.bxSaid()"><span>✔ Said it</span></button>
          <button class="btn hot" onclick="Game.bxMiss()"><span>✘ Not yet</span></button>
          <button class="btn ghost" onclick="Game.bxReveal()"><span>Show the word</span></button></div>`;
    } else {
      panel=`<div class="bxturn" style="--tc:${cols[d.t]}"><b>${this.bxLetter(d.t)}</b> ${esc(name)}</div>
        ${d.mode==='pic'?`<img class="bxpic sm" src="${esc(cur.img)}" alt="">`:''}
        <div class="bxword on">${esc(cur.w)} · ${esc(cur.t)}</div>
        <div class="bxmsg">Draw one line. Tap a gap between two dots.</div>
        ${d.hist.length?`<button class="btn ghost" onclick="Game.bxUndo()"><span>Undo last line (U)</span></button>`:''}`;
    }
    const left=d.box.filter(x=>x<0).length;
    stage.innerHTML=`<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div class="legend">${d.pts.map((p,i)=>`<span class="chip"><span style="color:${cols[i]}"><b>${this.bxLetter(i)}</b></span> <span>${esc(Teams.list[i].name)} <b>${p}</b></span></span>`).join('')}
        <span class="chip"><span>${left} box${left===1?'':'es'} left</span></span>
        <button class="chip" onclick="Game.bxSetup()"><span>Setup</span></button>
        <button class="chip" onclick="Game.boxes()"><span>New board</span></button></div>
      <div class="bxwrap"><div class="bxboard">${this.bxSvg()}</div><div class="bxpanel">${panel}
        ${d.last?`<div class="bxlast">Last word: ${esc(d.last.w)} · ${esc(d.last.t)}</div>`:''}</div></div>
      </div>`;
  },
  bxReveal(){ const d=this._bx, el=$('#bxword'); if(!d||d.phase!=='ask'||!el) return; el.textContent=d.cur.w+' · '+d.cur.t; el.classList.add('on'); },
  bxSaid(){ const d=this._bx; if(!d||d.phase!=='ask') return; d.phase='draw'; this.bxDraw(); },
  bxMiss(){
    const d=this._bx; if(!d||d.phase!=='ask') return;
    d.last=d.cur; d.t=(d.t+1)%d.n; d.msg=''; this.bxNext(); this.bxDraw();
  },
  bxLine(t,i,j){
    const d=this._bx; if(!d||d.phase!=='draw') return;
    const R=d.R, C=d.C, arr=t==='h'?d.h:d.v, k=t==='h'?i*C+j:i*(C+1)+j; if(arr[k]>=0) return;
    d.hist.push(JSON.parse(JSON.stringify({h:d.h,v:d.v,box:d.box,pts:d.pts,t:d.t,phase:d.phase,cur:d.cur,last:d.last,msg:d.msg,queue:d.queue})));
    arr[k]=d.t;
    const full=(a,b)=>d.h[a*C+b]>=0&&d.h[(a+1)*C+b]>=0&&d.v[a*(C+1)+b]>=0&&d.v[a*(C+1)+b+1]>=0;
    const cand=t==='h'?[[i-1,j],[i,j]]:[[i,j-1],[i,j]];
    let got=0;
    cand.forEach(([a,b])=>{ if(a>=0&&a<R&&b>=0&&b<C&&d.box[a*C+b]<0&&full(a,b)){ d.box[a*C+b]=d.t; d.pts[d.t]++; got++; } });
    d.last=d.cur;
    if(!d.box.some(x=>x<0)){ this.bxDraw(); this.bxEnd(); return; }
    if(got){ d.msg=(got>1?got+' boxes! ':'Box! ')+'Go again.'; }
    else { d.t=(d.t+1)%d.n; d.msg=''; }
    d.phase='ask'; this.bxNext(); this.bxDraw();
  },
  bxUndo(){
    const d=this._bx; if(!d||!d.hist.length) return;
    Object.assign(d,d.hist.pop()); this.bxDraw();
  },
  bxEnd(){
    const d=this._bx, max=Math.max(...d.pts), win=d.pts.map((p,i)=>p===max?i:-1).filter(i=>i>=0);
    d.pts.forEach((p,i)=>{ if(p>0){ Teams.turn=i; Teams.add(p); } });
    ov.className='ov on';
    ov.innerHTML=`<div class="badge">All boxes taken</div>
      <div class="worth">${win.map(i=>esc(Teams.list[i].name)).join(' & ')} ${win.length>1?'tie':'win'}</div>
      <p class="sub">${d.pts.map((p,i)=>esc(Teams.list[i].name)+' '+p).join(' · ')}. Each box counts as a point on the scoreboard.</p>
      <div class="row"><button class="btn" onclick="Game.bxStart()"><span>Play again ▶</span></button>
        <button class="btn ghost" onclick="Game.bxSetup()"><span>Setup</span></button>
        <button class="btn ghost" onclick="Game.home()"><span>Menu</span></button></div>`;
    this.bingoConfetti();
  },

  /* ================================================================
     GUESS-EROO: Baamboozle's Guess-eroo is Guess Who played with the
     quiz's own cards. One secret picture. Teams take turns asking a
     yes/no question; the teacher peeks, answers, and the class flips
     the cards that cannot be it. A team may stop and make a guess:
     right wins the round, wrong flips that card and passes the turn.
     Nothing is judged by the screen: the teacher peeks and answers.
     Needs unit.pics. Question chips are optional scaffolding.
     ================================================================ */
  geQs(){ return this.unit.guessQs||['Is it green?','Is it red?','Is it purple?','Is it orange?','Is it long?','Is it round?','Is it a vegetable?','Is it an action?']; },
  guessEroo(){
    this._ge={pool:this.dvPics().map(p=>({...p,on:true})),labels:false,helper:true,queue:[],secret:null,
      t:0,out:new Set(),log:[],guessing:false,done:false};
    this.geSetup();
  },
  geOn(){ return this._ge.pool.filter(p=>p.on); },
  geSet(k,v){ this._ge[k]=v; this.geSetup(); },
  geToggle(i){ const p=this._ge.pool[i]; p.on=!p.on; this.geSetup(); },
  geSetup(){
    stopTimer(); ov.classList.remove('on');
    const d=this._ge, on=this.geOn().length;
    const opt=(label,cur,val,fn)=>`<button class="bgopt${cur===val?' sel':''}" onclick="${fn}"><span>${label}</span></button>`;
    stage.innerHTML=`<div class="pad"><h1 class="h1">Guess-eroo</h1>
      <p class="sub">One secret picture. Teams ask yes/no questions in English and flip over the cards that cannot be it.</p>
      <div class="bgset">
        <div class="bgrow"><span class="bglab">Words under cards</span>${opt('Hidden',d.labels,false,"Game.geSet('labels',false)")}${opt('Shown',d.labels,true,"Game.geSet('labels',true)")}</div>
