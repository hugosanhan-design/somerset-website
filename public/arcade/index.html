<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Somerset Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600..900&family=Instrument+Sans:wght@400..700&family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   SOMERSET ARCADE — skin: INK  (design direction 03, chosen 4 Sep 2026)
   Two rules this skin must never break:
   1. Somerset's own palette. Green / coral / gold — the same inks as
      the September booklet. Not another school's colours.
   2. Nothing the children must READ is skewed, condensed or in caps.
      Panels skew; English does not. Questions, options, clues and
      vocabulary are all set in Instrument Sans, upright, sentence case.
   ================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#6BAE2E; --green-deep:#2F6B1A; --green-ink:#1E4227; --dark:#141110; --dark2:#211D1A;
  --paper:#F7F3EA; --sand:#E7E4D8; --hot:#E2542C; --gold:#E8A020; --ice:#3A8FA3;
  --cond:'Archivo',system-ui,sans-serif;      /* headings, labels, numbers ONLY */
  --sans:'Instrument Sans',system-ui,sans-serif; /* everything they read */
  --serif:'Fraunces',Georgia,serif;
  --skew:-7deg;
}
html,body{height:100%;overflow:hidden;font-family:var(--sans);background:var(--dark);color:#fff}
button{font-family:inherit;cursor:pointer;border:0}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;isolation:isolate}

/* ---------- the ink ---------- */
.wrap::before,.wrap::after{content:"";position:fixed;z-index:-2;pointer-events:none}
.wrap::before{top:-14vh;left:-9vw;width:64vw;height:66vh;background:var(--green);opacity:.92;
  border-radius:48% 52% 38% 62%/54% 40% 60% 46%;transform:rotate(-8deg);
  animation:drift1 22s ease-in-out infinite alternate}
.wrap::after{bottom:-22vh;right:-8vw;width:58vw;height:62vh;background:var(--hot);opacity:.9;
  border-radius:56% 44% 62% 38%/42% 58% 42% 58%;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:rotate(-3deg) scale(1.06) translate(2vw,1vh)}}
@keyframes drift2{to{transform:rotate(5deg) scale(1.05) translate(-2vw,-1vh)}}
.wrap>*{position:relative;z-index:1}
.halftone{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.16;
  background-image:radial-gradient(#000 1.1px,transparent 1.2px);background-size:7px 7px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:16px;padding:12px 26px;flex-shrink:0;
     background:rgba(20,17,16,.55);backdrop-filter:blur(7px);border-bottom:3px solid #fff}
.logo{font-family:var(--cond);font-weight:900;font-size:clamp(19px,2.1vw,27px);text-transform:uppercase;
  letter-spacing:.01em;line-height:.95;color:#fff}
.logo small{display:inline-block;font-family:var(--cond);font-size:10px;font-weight:800;letter-spacing:.26em;
  background:#fff;color:var(--dark);padding:1px 7px;margin-top:3px}
.bar .unit{font-family:var(--cond);font-size:clamp(11px,1.1vw,13px);font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;color:rgba(255,255,255,.85)}
.bar .auto{font-family:var(--cond);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  background:var(--gold);color:var(--dark);padding:4px 11px;transform:skewX(var(--skew))}
.bar .auto:empty{display:none}
.bar .sp{flex:1}
.bar select{font-family:var(--cond);font-size:13px;font-weight:700;padding:7px 11px;border:2px solid #fff;
  background:var(--dark);color:#fff;transform:skewX(var(--skew));text-transform:uppercase;letter-spacing:.06em}
.bar button{background:#fff;color:var(--dark);font-family:var(--cond);font-weight:800;font-size:13px;
  text-transform:uppercase;letter-spacing:.08em;padding:8px 15px;transform:skewX(var(--skew));transition:.14s}
.bar button:hover{background:var(--gold)}
.bar button>span,.bar select>option{display:inline-block;transform:skewX(calc(-1*var(--skew)))}

.stage{flex:1;position:relative;overflow:auto}
.pad{padding:clamp(14px,2.6vh,30px) clamp(16px,2.6vw,36px);min-height:100%;display:flex;flex-direction:column}

/* ---------- launcher ---------- */
.h1{font-family:var(--cond);font-weight:900;font-size:clamp(34px,5.4vw,68px);line-height:.95;
  text-transform:uppercase;transform:skewX(var(--skew));transform-origin:left;margin-bottom:6px;
  text-shadow:5px 5px 0 rgba(0,0,0,.35)}
.sub{font-family:var(--cond);font-size:clamp(12px,1.3vw,16px);font-weight:700;text-transform:uppercase;
  letter-spacing:.2em;color:rgba(255,255,255,.85);margin-bottom:clamp(12px,2.2vh,24px)}
.tiles{display:flex;flex-wrap:wrap;gap:clamp(9px,1.1vw,15px);flex:1;align-content:flex-start}
.tile{flex:1 1 240px;max-width:none;min-height:150px;padding:17px 19px 15px;background:var(--dark2);
  border:3px solid #fff;transform:skewX(var(--skew));display:flex;flex-direction:column;
  justify-content:space-between;text-align:left;color:#fff;transition:background .14s,transform .14s;
  animation:slam .34s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.tile>*{transform:skewX(calc(-1*var(--skew)))}
.tile:nth-child(even){background:#1A1614}
.tile .ic{font-size:34px;line-height:1}
.tile h3{font-family:var(--cond);font-weight:900;font-size:clamp(18px,2vw,26px);text-transform:uppercase;
  line-height:.97;margin:9px 0 5px}
.tile p{font-family:var(--sans);font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.72)}
.tile:hover{background:var(--green);border-color:var(--dark);transform:skewX(var(--skew)) translateY(-9px)}
.tile:hover p{color:#0F2107}
.tile.case{background:var(--hot);border-color:#fff}
.tile.case p{color:rgba(255,255,255,.9)}
.tile.case:hover{background:var(--gold);border-color:var(--dark)}
.tile.case:hover p,.tile.case:hover h3{color:var(--dark)}
/* Somerset Pursuit tile — added 25 Sep 2026 for the B2 Conversación
   group. Cobalt, matching the Historia azulejo, so it reads as its
   own thing next to the coral Case tile. */
.tile.pursuit{background:#1C4E9C;border-color:#fff}
.tile.pursuit p{color:rgba(255,255,255,.9)}
.tile.pursuit:hover{background:var(--gold);border-color:var(--dark)}
.tile.pursuit:hover p,.tile.pursuit:hover h3{color:var(--dark)}
@keyframes slam{from{opacity:0;transform:skewX(var(--skew)) scale(.72) translateY(26px)}}

/* ---------- teams ---------- */
.teams{display:flex;gap:11px;margin-bottom:13px;flex-wrap:wrap;flex-shrink:0}
.team{flex:1 1 160px;padding:10px 15px;background:var(--dark2);border:3px solid #fff;
  transform:skewX(var(--skew));display:flex;align-items:center;gap:12px}
.team>*{transform:skewX(calc(-1*var(--skew)))}
.team:nth-child(1){border-left:11px solid var(--green)}
.team:nth-child(2){border-left:11px solid var(--hot)}
.team:nth-child(3){border-left:11px solid var(--gold)}
.team.on{background:#fff;color:var(--dark)}
.team.on .pm button{background:rgba(0,0,0,.12);color:var(--dark)}
.team .nm{font-family:var(--cond);font-weight:800;font-size:14px;text-transform:uppercase;
  letter-spacing:.09em;flex:1}
.team .sc{font-family:var(--cond);font-weight:900;font-size:clamp(26px,2.9vw,40px);line-height:.9;
  animation:pop .34s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:skewX(calc(-1*var(--skew))) scale(1.55);color:var(--gold)}}
.team .pm{display:flex;gap:5px}
/* Added 18 Sep 2026: compact trophy button that sits beside the team
   cards (deliberately NOT a .team — it must not be counted as one) to
   open the manual "declare winner" screen. */
.winbtn{flex:0 0 auto;padding:10px 16px;background:var(--dark2);border:3px solid #fff;
  border-left:11px solid var(--gold);color:#fff;transform:skewX(var(--skew));
  display:flex;align-items:center;cursor:pointer;font-size:20px}
.winbtn>span{transform:skewX(calc(-1*var(--skew)))}
.winnerName{font-size:clamp(40px,9vw,120px)!important;text-align:center;max-width:none!important}
.ov.winner::before{background:var(--gold);opacity:.22}
.team .pm button{width:27px;height:27px;background:rgba(255,255,255,.17);color:#fff;font-family:var(--cond);
  font-weight:900;font-size:15px;line-height:1}

/* ---------- point grab ---------- */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(7px,.9vw,12px);flex:1;
  grid-auto-rows:minmax(0,1fr)}
.cell{background:var(--dark2);border:3px solid #fff;transform:skewX(var(--skew));color:#fff;
  font-family:var(--cond);font-weight:900;font-size:clamp(24px,3.4vw,50px);display:flex;align-items:center;
  justify-content:center;position:relative;transition:background .12s,transform .12s;
  animation:slam .3s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i,0)*22ms)}
.cell>span,.cell{line-height:1}
.cell::before{content:attr(data-n);transform:skewX(calc(-1*var(--skew)))}
.cell:hover{background:var(--green);border-color:var(--dark);transform:skewX(var(--skew)) scale(1.05)}
/* the tile's value is SECRET until it has been played — otherwise the
   class can see which tiles are ×2 or STEAL and just picks those */
.cell .pts{position:absolute;bottom:5px;right:8px;font-family:var(--cond);font-size:11px;font-weight:900;
  letter-spacing:.08em;transform:skewX(calc(-1*var(--skew)));color:var(--gold);opacity:0}
.cell.done .pts{opacity:1}
.cell.done{background:transparent;border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.18);
  pointer-events:none}
.cell.done::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to bottom right,transparent calc(50% - 2px),rgba(255,255,255,.22) 50%,transparent calc(50% + 2px))}
.cell.done .pts{color:rgba(255,255,255,.18)}

/* ---------- question overlay ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(15,13,12,.97);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:5vh 6vw;text-align:center;gap:22px}
.ov.on{display:flex}
.ov::before{content:"";position:absolute;width:78vw;height:78vh;background:var(--green);opacity:.17;
  border-radius:52% 48% 40% 60%/46% 56% 44% 54%;z-index:-1;animation:slam .4s cubic-bezier(.2,1.3,.4,1)}
.ov .badge{font-family:var(--cond);font-size:13px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);background:var(--dark);border:2px solid var(--gold);padding:6px 15px;
  transform:skewX(var(--skew))}
.ov .q{font-family:var(--sans);font-weight:600;font-size:clamp(30px,4.6vw,66px);line-height:1.14;max-width:22ch}
.ov .a{font-family:var(--sans);font-weight:700;font-size:clamp(22px,3.2vw,46px);color:var(--dark);
  background:var(--green);padding:.28em .7em;display:none}
.ov .a.on{display:block;animation:splat .34s cubic-bezier(.2,1.8,.4,1)}
@keyframes splat{0%{transform:scale(.5) rotate(-4deg);opacity:0}60%{transform:scale(1.08) rotate(1deg)}}
.ov .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn{background:#fff;color:var(--dark);font-family:var(--cond);font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;font-size:clamp(14px,1.5vw,19px);padding:.65em 1.5em;transform:skewX(var(--skew));
  transition:.13s}
.btn>span{display:inline-block;transform:skewX(calc(-1*var(--skew)))}
.btn:hover{background:var(--gold)}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.btn.ghost:hover{background:#fff;color:var(--dark)}
.btn.hot{background:var(--hot);color:#fff}
.btn.hot:hover{background:var(--gold);color:var(--dark)}

/* ---------- memory / guess who ---------- */
.board{display:grid;gap:clamp(5px,.7vw,10px);flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.pc{position:relative;overflow:hidden;background:var(--dark2);border:3px solid #fff;
  transform:skewX(var(--skew));transition:transform .13s;
  animation:slam .3s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i,0)*18ms)}
.pc img{width:100%;height:100%;object-fit:cover;object-position:center 24%;display:block;
  transform:skewX(calc(-1*var(--skew))) scale(1.22)}
.pc .back{position:absolute;inset:0;background:var(--green);display:flex;align-items:center;
  justify-content:center;font-family:var(--cond);font-weight:900;font-size:clamp(20px,2.6vw,40px);
  color:var(--dark)}
.pc .back>span{transform:skewX(calc(-1*var(--skew)))}
.pc.flip .back{display:none}
.pc:hover{transform:skewX(var(--skew)) translateY(-5px)}
.pc.out{opacity:.2}
.pc.out::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to bottom right,transparent calc(50% - 3px),var(--hot) 50%,transparent calc(50% + 3px))}
.pc .tagn{position:absolute;top:4px;left:5px;background:var(--dark);color:#fff;font-family:var(--cond);
  font-size:11px;font-weight:900;padding:2px 7px;transform:skewX(calc(-1*var(--skew)))}
.legend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px;align-items:center;flex-shrink:0}
.chip{background:var(--dark2);border:2px solid #fff;padding:7px 14px;font-size:14px;font-weight:500;
  transform:skewX(var(--skew));font-family:var(--sans)}
.chip>span{display:inline-block;transform:skewX(calc(-1*var(--skew)))}
.chip b{font-weight:700;color:var(--gold)}

/* ---------- the case ---------- */
.locks{display:flex;flex-direction:column;gap:11px;max-width:960px}
.lock{background:var(--dark2);border:3px solid rgba(255,255,255,.3);padding:15px 19px;
  transform:skewX(var(--skew))}
.lock>*{transform:skewX(calc(-1*var(--skew)))}
.lock.now{border-color:var(--hot);background:rgba(226,84,44,.16);animation:edge 1.9s ease-in-out infinite}
@keyframes edge{50%{border-color:var(--gold)}}
.lock.ok{border-color:var(--green);background:rgba(107,174,46,.18)}
.lock h4{font-family:var(--cond);font-weight:900;font-size:clamp(17px,2vw,26px);text-transform:uppercase;
  display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.lock .st{margin-left:auto;font-size:22px}
.lock .body{margin-top:12px;display:none}
.lock.now .body{display:block}

/* ---------- team setup ---------- */
.setup{max-width:1000px}
.setup h2{font-family:var(--cond);font-weight:900;font-size:clamp(15px,1.6vw,19px);text-transform:uppercase;
  letter-spacing:.14em;color:var(--gold);margin:0 0 9px}
.setup section{margin-bottom:20px}
.count{display:flex;gap:9px;flex-wrap:wrap}
.count button{background:var(--dark2);border:3px solid rgba(255,255,255,.35);color:#fff;font-family:var(--cond);
  font-weight:900;font-size:22px;width:62px;height:52px;transform:skewX(var(--skew));transition:.13s}
.count button>span{display:inline-block;transform:skewX(calc(-1*var(--skew)))}
.count button.on{background:#fff;color:var(--dark);border-color:#fff}
.count button:hover{border-color:var(--green)}
#roster{width:100%;max-width:560px;min-height:96px;background:var(--dark2);border:3px solid rgba(255,255,255,.35);
  color:#fff;font-family:var(--sans);font-size:16px;line-height:1.5;padding:12px 14px;resize:vertical}
#roster:focus{outline:0;border-color:var(--green)}
.hint{font-family:var(--sans);font-size:13.5px;color:rgba(255,255,255,.7);margin-top:7px;max-width:60ch;
  line-height:1.5}
.hcap{display:flex;align-items:center;gap:11px;font-family:var(--sans);font-size:15px;cursor:pointer;
  user-select:none}
.hcap input{width:19px;height:19px;accent-color:var(--green)}
.prev{display:flex;gap:11px;flex-wrap:wrap;margin-top:4px}
.pteam{flex:1 1 175px;background:var(--dark2);border:3px solid #fff;padding:12px 15px;
  transform:skewX(var(--skew))}
.pteam>*{transform:skewX(calc(-1*var(--skew)))}
.pteam:nth-child(1){border-left:11px solid var(--green)}
.pteam:nth-child(2){border-left:11px solid var(--hot)}
.pteam:nth-child(3){border-left:11px solid var(--gold)}
.pteam:nth-child(4){border-left:11px solid var(--ice)}
.pteam:nth-child(5){border-left:11px solid #fff}
.pteam h5{font-family:var(--cond);font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pteam .mult{font-family:var(--cond);font-size:12px;font-weight:900;background:var(--gold);color:var(--dark);
  padding:2px 7px;margin-left:auto}
.pteam ul{list-style:none;font-family:var(--sans);font-size:14.5px;line-height:1.65}
.pteam li::before{content:"· "}
.pteam .empty{font-family:var(--sans);font-size:14px;color:rgba(255,255,255,.5);font-style:italic}
.team .mult{font-family:var(--cond);font-size:11px;font-weight:900;background:var(--gold);color:var(--dark);
  padding:1px 6px}
.team.on .mult{background:var(--hot);color:#fff}
.steal{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lock p.pr{font-family:var(--sans);font-size:clamp(15px,1.6vw,21px);line-height:1.45;
  color:rgba(255,255,255,.92);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.28);color:#fff;
  padding:12px 16px;font-family:var(--sans);font-size:clamp(14px,1.5vw,19px);font-weight:500;transition:.13s}
.opt:hover{background:#fff;color:var(--dark);border-color:#fff}
.opt.bad{background:rgba(226,84,44,.4);border-color:var(--hot);text-decoration:line-through;opacity:.65}
.opt.good{background:var(--green);color:var(--dark);border-color:var(--green)}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mw{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);padding:10px 15px;
  font-family:var(--sans);font-size:clamp(14px,1.5vw,19px);font-weight:600;color:#fff;transition:.12s}
.mw:hover{background:rgba(255,255,255,.24)}
.mw.sel{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.mw.done{opacity:.25;pointer-events:none;text-decoration:line-through}
.sus{display:flex;flex-wrap:wrap;gap:9px}
.suscard{flex:1 1 155px;background:rgba(255,255,255,.09);border:3px solid rgba(255,255,255,.25);
  padding:11px 14px;text-align:left;color:#fff;font-family:var(--sans);font-size:13.5px;line-height:1.55;
  transition:.13s;position:relative}
.suscard b{font-family:var(--cond);font-weight:900;font-size:17px;text-transform:uppercase;display:block;
  margin-bottom:4px;letter-spacing:.05em}
.suscard:hover{border-color:#fff}
.suscard.out{opacity:.32}
.suscard.out::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to bottom right,transparent calc(50% - 3px),var(--hot) 50%,transparent calc(50% + 3px))}
.suscard.pick{border-color:var(--gold)}
.clues{background:rgba(232,160,32,.15);border-left:5px solid var(--gold);padding:11px 15px;margin-bottom:13px;
  font-family:var(--sans);font-size:clamp(14px,1.5vw,18px);line-height:1.75}

/* ================= STINGERS =================
   Full-screen motion overlays that fly in and disappear. They play on
   TOP of the question overlay (z-index 90 vs 60), so the reveal is the
   first thing the room sees after a tile is clicked. */
.sting{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.sting .stingtxt{font-family:var(--cond);font-weight:900;text-transform:uppercase;color:#fff;
  text-shadow:7px 7px 0 rgba(0,0,0,.42);white-space:nowrap;line-height:.9;position:relative}

.sting.pts .stingtxt{font-size:clamp(48px,8vw,132px);color:#fff;
  animation:stPts .75s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stPts{0%{transform:scale(.35);opacity:0}22%{transform:scale(1.06);opacity:1}
  70%{transform:scale(1);opacity:1}100%{transform:scale(1.12) translateY(-38px);opacity:0}}

.sting.x2::before{content:"";position:absolute;inset:-25%;
  background:repeating-conic-gradient(from 0deg,var(--gold) 0 7deg,transparent 7deg 14deg);
  animation:stRays 1.25s linear forwards}
@keyframes stRays{0%{transform:rotate(0) scale(.15);opacity:0}22%{opacity:.55}
  100%{transform:rotate(70deg) scale(1.5);opacity:0}}
.sting.x2 .stingtxt{font-size:clamp(92px,21vw,300px);color:var(--gold);
  -webkit-text-stroke:4px var(--dark);animation:stX2 1.25s cubic-bezier(.2,1.7,.35,1) forwards}
@keyframes stX2{0%{transform:scale(3.4) rotate(-26deg);opacity:0}
  17%{transform:scale(1) rotate(-8deg);opacity:1}68%{transform:scale(1) rotate(-8deg);opacity:1}
  100%{transform:scale(1.55) rotate(-8deg);opacity:0}}

.sting.steal::before{content:"";position:absolute;top:-10%;bottom:-10%;width:170%;left:-175%;
  background:linear-gradient(100deg,transparent,var(--hot) 16%,var(--hot) 84%,transparent);
  transform:skewX(-13deg);animation:stSwipe 1.25s cubic-bezier(.45,0,.2,1) forwards}
@keyframes stSwipe{0%{left:-175%}52%{left:-8%}100%{left:125%}}
.sting.steal .stingtxt{font-size:clamp(58px,13vw,190px);transform:skewX(-13deg);
  animation:stSteal 1.25s ease-out forwards}
@keyframes stSteal{0%{transform:translateX(-46vw) skewX(-13deg);opacity:0}
  28%{transform:translateX(0) skewX(-13deg);opacity:1}72%{opacity:1}
  100%{transform:translateX(34vw) skewX(-13deg);opacity:0}}

.ov .worth{font-family:var(--cond);font-weight:900;font-size:clamp(15px,1.7vw,22px);text-transform:uppercase;
  letter-spacing:.14em;background:#fff;color:var(--dark);padding:5px 15px;transform:skewX(var(--skew))}
.ov .worth.x2{background:var(--gold)}
.ov .worth.steal{background:var(--hot);color:#fff}

/* ================= VALENCIAN GAME MODES ================= */
.pmsg{font-family:var(--sans);font-size:clamp(15px,1.7vw,22px);font-weight:600;margin:12px 0 14px;
  color:#fff;min-height:1.4em}
.vrow{display:flex;gap:11px;flex-wrap:wrap;align-items:center}

/* --- pilota: the trinquet --- */
.court{flex:1;min-height:0;position:relative;background:linear-gradient(#2A2622,#1A1614);
  border:3px solid #fff;margin-bottom:13px;overflow:hidden}
.court .line{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.22)}
.court .net{position:absolute;left:50%;top:8%;bottom:8%;width:3px;background:rgba(255,255,255,.5);
  transform:translateX(-50%)}
.court .wall{position:absolute;left:0;top:0;bottom:0;width:26px;background:repeating-linear-gradient(
  180deg,rgba(255,255,255,.12) 0 14px,transparent 14px 28px)}
.court .ball{position:absolute;top:46%;left:12%;font-size:clamp(26px,3.4vw,44px);
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.court .ball.hit{animation:rally .9s cubic-bezier(.3,.1,.5,1)}
.court .ball.miss{animation:netted .8s ease-in}
@keyframes rally{0%{left:12%;top:50%}35%{left:46%;top:16%}70%{left:74%;top:56%}100%{left:88%;top:44%}}
@keyframes netted{0%{left:12%;top:50%}60%{left:47%;top:22%}100%{left:50%;top:78%;opacity:.35}}
.pilscore{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:8px}
.pil{flex:1 1 190px;background:var(--dark2);border:3px solid #fff;padding:10px 15px;
  transform:skewX(var(--skew));display:flex;align-items:center;gap:11px}
.pil>*{transform:skewX(calc(-1*var(--skew)))}
.pil.on{background:#fff;color:var(--dark)}
.pil .nm{font-family:var(--cond);font-weight:800;font-size:14px;text-transform:uppercase;
  letter-spacing:.08em;flex:1}
.pil .val{font-family:var(--cond);font-weight:900;font-size:clamp(18px,2.1vw,27px);color:var(--gold)}
.pil.on .val{color:var(--hot)}
.pil .jocs{font-family:var(--sans);font-size:12.5px;opacity:.75}

/* --- paella --- */
.pan{flex:0 0 auto;height:clamp(80px,15vh,140px);border:5px solid #8A8A8A;border-radius:50%/22%;
  background:radial-gradient(ellipse at 50% 40%,#E8A020 0 40%,#C97F16 70%,#8A5A0E 100%);
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:clamp(22px,3vw,40px);
  margin-bottom:13px;flex-wrap:wrap;padding:0 20px;overflow:hidden}
.pan .empty{font-family:var(--sans);font-size:15px;font-weight:600;color:rgba(0,0,0,.5)}
.ings{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;flex:1;min-height:0;
  grid-auto-rows:minmax(0,1fr)}
.ing{background:var(--dark2);border:3px solid #fff;transform:skewX(var(--skew));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:clamp(20px,2.6vw,34px);transition:.13s;padding:6px}
.ing>*{transform:skewX(calc(-1*var(--skew)))}
.ing span{font-family:var(--sans);font-size:12.5px;font-weight:600;line-height:1.15;text-align:center}
.ing:hover{background:var(--green);border-color:var(--dark)}
.ing.taken{opacity:.28;pointer-events:none}
.ing.bad.taken{border-color:var(--hot)}

/* --- el mercat (build the paella) --- */
.mkwrap{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.recpick{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}
.reccard{background:var(--dark2);border:3px solid #fff;transform:skewX(var(--skew));padding:18px 16px;
  text-align:left;transition:.13s;color:#fff}
.reccard>*{transform:skewX(calc(-1*var(--skew)))}
.reccard:hover{background:var(--green);border-color:var(--dark)}
.reccard b{font-family:var(--cond);font-weight:900;text-transform:uppercase;
  font-size:clamp(17px,2.1vw,25px);display:block;margin-bottom:7px;line-height:1.05}
.reccard span{font-family:var(--sans);font-size:13.5px;line-height:1.45;display:block;opacity:.85}
.mkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.coin{font-family:var(--cond);font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  background:var(--gold);color:var(--dark);padding:7px 14px;transform:skewX(var(--skew));font-size:15px}
.coin>span{display:inline-block;transform:skewX(calc(-1*var(--skew)))}
.coin.none{background:var(--dark2);color:#fff;opacity:.6}
.verdict{text-align:center;padding:26px 20px;border:4px solid #fff;background:var(--dark2);
  transform:skewX(var(--skew));animation:slam .3s cubic-bezier(.2,1.5,.4,1);margin-top:8px}
.verdict>*{transform:skewX(calc(-1*var(--skew)))}
.verdict.win{border-color:var(--green);background:rgba(107,174,46,.22)}
.verdict.lose{border-color:var(--hot);background:rgba(226,84,44,.18)}
.verdict .party{font-size:clamp(30px,6vw,64px);letter-spacing:.08em;margin-bottom:6px}
.verdict .val{font-family:var(--cond);font-weight:900;text-transform:uppercase;
  font-size:clamp(19px,3.2vw,40px);line-height:1.12}
.verdict .en{font-family:var(--sans);font-size:clamp(13px,1.5vw,18px);margin-top:10px;opacity:.85}
.verdict .lst{font-family:var(--sans);font-size:14px;margin-top:13px;opacity:.82;line-height:1.5}
.verdict .lst b{color:var(--gold)}

/* --- sambori --- */
.sam{flex:1;min-height:0;display:flex;flex-direction:column-reverse;align-items:center;gap:7px;
  padding:8px 0}
.samrow{display:flex;gap:7px}
.sq{width:clamp(58px,7vw,96px);height:clamp(38px,6.4vh,64px);background:var(--dark2);border:3px solid #fff;
  transform:skewX(var(--skew));display:flex;align-items:center;justify-content:center;position:relative;
  font-family:var(--cond);font-weight:900;font-size:clamp(15px,1.9vw,24px)}
.sq>*{transform:skewX(calc(-1*var(--skew)))}
.sq.up{background:rgba(107,174,46,.35);border-color:var(--green)}
.sq.down{background:rgba(226,84,44,.35);border-color:var(--hot)}
.sq.cel{background:var(--gold);color:var(--dark)}
.sq .tok{position:absolute;bottom:-9px;display:flex;gap:3px;font-size:15px}

/* --- falla --- */
.fallas{display:flex;gap:16px;flex:1;min-height:0;align-items:flex-end;justify-content:center;
  padding-bottom:10px}
.fal{flex:1 1 160px;max-width:230px;display:flex;flex-direction:column;align-items:center;gap:5px}
.fal .stack{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:0}
.fal .blk{background:linear-gradient(150deg,var(--gold),var(--hot));border:2px solid #fff;
  height:clamp(13px,2.2vh,22px);animation:slam .3s cubic-bezier(.2,1.5,.4,1)}
.fal .blk:nth-child(1){width:150px}.fal .blk:nth-child(2){width:134px}
.fal .blk:nth-child(3){width:118px}.fal .blk:nth-child(4){width:102px}
.fal .blk:nth-child(5){width:86px}.fal .blk:nth-child(6){width:70px}
.fal .blk:nth-child(7){width:54px}.fal .blk:nth-child(8){width:38px;background:var(--green)}
.fal .ninot{font-size:26px}
.fal .lbl{font-family:var(--cond);font-weight:900;font-size:13px;text-transform:uppercase;
  letter-spacing:.08em;text-align:center}
.fal.burning .blk{animation:burn .9s ease-in forwards}

/* ---------- somerset pursuit (added 25 Sep 2026, B2 Conversación) ----------
   A Trivial-Pursuit-style ring: 24 spaces round the border of a 7×7
   CSS grid (4×7-4=24, exactly), leaving the interior 5×5 free for the
   centre hub — no absolute positioning needed. Six spaces, one every
   four (index%4===0), are each colour's HQ. Manises-style ceramic
   azulejo tiles mark categories and collected pieces: four white
   quarter-circle petals meeting in the middle of a coloured square,
   drawn with layered radial-gradients — no external images, same rule
   as every other icon in this app. */
.pcatlegend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.pleg{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;
  color:rgba(255,255,255,.85)}
.azulejo{width:22px;height:22px;flex:0 0 auto;background:var(--pc,#888);border:2px solid #fff;
  position:relative}
.azulejo.sm{width:15px;height:15px;border-width:1px}
.azulejo.xs{width:13px;height:13px;border-width:1px}
.azulejo.xs.empty{opacity:.2;filter:grayscale(1)}
.azulejo::after{content:"";position:absolute;inset:14%;
  background:
    radial-gradient(circle at 0 0,   transparent 58%, #fff 60% 64%, transparent 66%),
    radial-gradient(circle at 100% 0,transparent 58%, #fff 60% 64%, transparent 66%),
    radial-gradient(circle at 0 100%,transparent 58%, #fff 60% 64%, transparent 66%),
    radial-gradient(circle at 100% 100%,transparent 58%,#fff 60% 64%, transparent 66%);}
.pursuit-wrap{display:flex;justify-content:center;margin:4px 0 8px;flex:1;min-height:0}
.pursuit-board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
  gap:3px;width:min(72vh,92vw,540px);aspect-ratio:1}
.pspace{background:var(--pc,#333);border:2px solid #fff;display:flex;align-items:center;
  justify-content:center;position:relative;min-width:0;min-height:0}
.pspace.hq{border:3px solid var(--gold)}
.ptok{position:absolute;font-size:clamp(10px,1.6vw,15px);display:flex;gap:1px;line-height:1}
.phub{background:var(--dark2);border:3px solid #fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;padding:6px;overflow:hidden}
.phubTitle{font-size:clamp(18px,3vw,34px)}
.phubTeams{display:flex;flex-direction:column;gap:4px;width:100%}
.phubTeam{display:flex;align-items:center;gap:5px;justify-content:space-between;
  font-family:var(--cond);font-size:clamp(8px,1vw,11px);text-transform:uppercase;
  letter-spacing:.05em;color:rgba(255,255,255,.7);padding:1px 4px}
.phubTeam.on{color:#fff;background:rgba(255,255,255,.12)}
.phubTeam .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9ch}
.phubTeam .tiles{display:flex;gap:2px;flex-shrink:0}
@keyframes burn{to{background:#3A1608;transform:translateY(14px) scaleY(.25);opacity:.35}}
.fal.burning .ninot{animation:flare .7s ease-out infinite alternate}
@keyframes flare{to{transform:translateY(-9px) scale(1.28);filter:hue-rotate(-18deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) skewX(var(--skew));background:var(--dark);
  border:3px solid #fff;padding:11px 26px;font-family:var(--cond);font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;z-index:80;display:none}
.toast.on{display:block;animation:slam .3s cubic-bezier(.2,1.5,.4,1)}
#tmr{position:fixed;top:70px;right:22px;z-index:70;font-family:var(--cond);font-weight:900;
  font-size:clamp(30px,3.6vw,56px);color:var(--dark);background:var(--gold);padding:3px 18px;
  transform:skewX(var(--skew));display:none}
#tmr.on{display:block}
/* Point Grab countdown: gold normally, coral in the last five seconds,
   coral + flash on TIME!. English never skews, but the chip may. */
/* ---- Hangman ---- */
.hmwrap{display:flex;gap:clamp(18px,4vw,54px);align-items:center;justify-content:center;
  flex-wrap:wrap;flex:1}
.hmfig{width:clamp(150px,18vw,260px);height:auto;flex-shrink:0}
.hmright{display:flex;flex-direction:column;gap:16px;align-items:center;min-width:min(100%,520px)}
.hmclue{display:flex;flex-direction:column;align-items:center;gap:8px}
/* Spanish clue: upright sentence case, never skewed — it is read, not decorated */
.hmclueword{font-family:var(--sans);font-weight:600;font-size:clamp(20px,2.6vw,38px);color:var(--paper)}
.hmword{display:flex;gap:clamp(5px,.8vw,12px);flex-wrap:wrap;justify-content:center}
.hmslot{font-family:var(--sans);font-weight:700;font-size:clamp(26px,4vw,60px);line-height:1.1;
  min-width:clamp(24px,3.4vw,50px);text-align:center;border-bottom:5px solid var(--green);
  color:var(--paper)}
.hmslot.free{border-bottom-color:transparent}
.hmlives{font-size:clamp(16px,1.8vw,26px);color:var(--green);letter-spacing:.18em}
.hmlives .gone{color:#5a534d}
.hmlivestxt{font-family:var(--cond);font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  font-size:13px;color:var(--paper);margin-left:12px}
.hmkeys{display:grid;grid-template-columns:repeat(13,1fr);gap:clamp(4px,.6vw,9px);width:100%}
.hmkey{font-family:var(--cond);font-weight:900;font-size:clamp(15px,1.7vw,26px);
  padding:clamp(5px,.8vh,12px) 0;background:var(--dark2);color:var(--paper);
  border:2px solid #4a443e;cursor:pointer;transform:skewX(var(--skew))}
.hmkey:hover:not(:disabled){background:var(--green);color:var(--dark);border-color:var(--green)}
.hmkey.hit{background:var(--green);color:var(--dark);border-color:var(--green)}
.hmkey.miss{background:transparent;color:#5a534d;border-color:#3a352f}
.hmkey:disabled{cursor:default}
@media (max-width:780px){.hmkeys{grid-template-columns:repeat(7,1fr)}}
#tmr.low{background:var(--hot);color:#fff}
#tmr.out{background:var(--hot);color:#fff;animation:slam .3s cubic-bezier(.2,1.5,.4,1)}
.tmrbtn{font-family:var(--cond);font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  font-size:13px;padding:6px 14px;border:2px solid var(--green);background:transparent;
  color:var(--green);cursor:pointer;transform:skewX(var(--skew))}
.tmrbtn.off{border-color:#777;color:#777}

/* ---------- weekly tracker (added 2 Oct 2026) ----------
   A compact strip below the team scorecards. Shows each team's
   accumulated points for the current ISO week and a progress bar
   toward WEEKLY_THRESHOLD. Turns gold once unlocked. */
.weekly-bar{padding:2px 0 9px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;flex-shrink:0}
.wlbl{font-family:var(--cond);font-size:11px;font-weight:900;text-transform:uppercase;
  letter-spacing:.12em;white-space:nowrap}
.wt-slot{display:flex;align-items:center;gap:4px;font-family:var(--cond);font-size:11px;
  font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.wt-nm{color:rgba(255,255,255,.65)}
.wt-pts{color:#fff;min-width:2.2ch;text-align:right}
.wt-bar{width:50px;height:4px;background:rgba(255,255,255,.18);overflow:hidden;flex-shrink:0}
.wt-bar-fill{height:100%;background:var(--green);transition:width .4s}
.wt-bar.done .wt-bar-fill{background:var(--gold)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.memory-game{height:calc(100dvh - 60px);min-height:560px}.memory-game .board{min-height:180px}.memory-game .pc img{position:absolute;inset:0}.memory-game>.row{flex-shrink:0}
.picture-tf{overflow-y:auto;justify-content:flex-start!important;padding:20px!important;gap:12px!important}.picture-pair{display:flex;gap:20px;justify-content:center;flex-shrink:0}.picture-pair figure{margin:0;text-align:center}.picture-pair img{height:clamp(140px,36vh,330px);width:clamp(130px,25vw,300px);object-fit:contain;background:#181818;border:3px solid white}.picture-pair figcaption{font-size:16px;margin-top:5px}.picture-tf .q{font-size:clamp(22px,3vw,38px);max-width:1000px}.picture-hint{font-size:15px;max-width:800px;text-align:center}
button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- somerset rounds + 1-2-3 (added 1 Oct 2026) ---------- */
.tile.rounds{background:#7A3E9D;border-color:#fff}.tile.rounds p{color:rgba(255,255,255,.9)}
.tile.rounds:hover,.tile.q123:hover{background:var(--gold);border-color:var(--dark)}
.tile.rounds:hover p,.tile.rounds:hover h3,.tile.q123:hover p,.tile.q123:hover h3{color:var(--dark)}
.tile.q123{background:var(--hot);border-color:#fff}.tile.q123 p{color:rgba(255,255,255,.92)}
.rd .pmsg b{color:var(--gold)}
.rd-names{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 18px}
.rd-in{font:600 20px var(--sans);padding:.5em .7em;border:3px solid #fff;background:var(--dark2);color:#fff;width:min(250px,100%)}
.rd-num{width:110px;display:inline-block;margin-left:8px}
.rd-tcard{display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.35);padding:12px;border-left:6px solid var(--green)}
.rd-lbl{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.rd-qs{list-style:none;display:grid;gap:8px;margin:10px 0;max-width:980px}
.rd-qs li{display:flex;gap:14px;align-items:flex-start;background:var(--dark2);border-left:6px solid var(--green);padding:10px 16px;font-size:clamp(16px,1.8vw,24px);line-height:1.25}
.rd-qs li b{font-family:var(--cond);color:var(--gold);min-width:1.3em}
.rd-qs li.done{opacity:.4;text-decoration:line-through;border-left-color:#777}
.rd-who{font-family:var(--cond);font-weight:900;font-size:clamp(30px,5vw,72px);text-align:center;line-height:1.05}
.rd-a{color:var(--green)}.rd-t{color:var(--gold)}
.rd-vote{display:grid;gap:6px;margin:12px 0 18px;max-width:980px}
.rd-vcard{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--dark2);border-left:6px solid var(--hot);padding:7px 14px}
.rd-vcard h3{font-family:var(--cond);font-size:clamp(20px,2.2vw,30px);text-transform:none}
.rd-vcard p{font-size:clamp(13px,1.2vw,16px);opacity:.9;margin-top:2px;line-height:1.25}
.rd-vc{display:flex;align-items:center;gap:10px;flex-shrink:0}
.rd-n{font-family:var(--cond);font-weight:900;font-size:clamp(24px,2.6vw,36px);min-width:1.4em;text-align:center}
</style>

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function toast(msg,ms=1800){const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms);}
function toggleFS(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}

function timer(sec,onEnd){const el=$('#tmr');el.classList.add('on');el.classList.remove('low','out');let t=sec;

/* ==================================================================
   THE TIMETABLE — this is the only part you edit when a class moves.
   d: 0=Sunday … 6=Saturday.  Times are 24h.  The Arcade opens on the
   class you are about to teach, with 45 minutes of setup grace before
   the start, so it is already right when you walk in.
   Several groups share a day, so the TIME is what tells them apart —
   without it Monday is ambiguous between Flyers and the B1.2 adults.

   Source: Hugo's contracted timetable, CURSO 2026-27 (20 h/week).
   Preparation slots are deliberately absent: during prep the Arcade
   points at the NEXT class of the day, which is what you want.

   Group ids are the class names Hugo actually says out loud. Folder
   mapping in Somerset Worksheets/groups/ :
     flyers      → groups/children/        (Our World 4)
     adults-b12  → groups/young-adults/    (Monday Adults — Miriam & Alejandra)
     b1-seniors  → groups/adults-tuesday/
     b2-conv     → groups/adults-wednesday/
     ket1 · pet1 · fce1 → see TIMETABLE_2026-27.md; the old
     `adolescents` and `teenagers` folders do not map cleanly.
     friday-b2  → groups/friday-b2/       (New Close-up B2 Split A — separate from fce1, same level, added 18 Sep 2026)
   ================================================================== */
const TIMETABLE=[
  /* MONDAY */
  {d:1, from:'17:30', to:'18:30', group:'flyers',     label:'Flyers I'},
  {d:1, from:'18:45', to:'20:45', group:'adults-b12', label:'B1.2 Adults'},
  /* TUESDAY */
  {d:2, from:'16:20', to:'17:20', group:'fce1',       label:'FCE I'},
  {d:2, from:'17:30', to:'18:30', group:'ket1',       label:'KET I'},
  {d:2, from:'18:45', to:'19:45', group:'b1-seniors', label:'B1 + Seniors'},
  /* WEDNESDAY */
  {d:3, from:'15:45', to:'17:15', group:'pet1',       label:'PET I'},
  {d:3, from:'17:30', to:'18:30', group:'flyers',     label:'Flyers I'},
  {d:3, from:'18:45', to:'20:15', group:'b2-conv',    label:'B2 Conversación'},
  /* THURSDAY */
  {d:4, from:'16:30', to:'17:30', group:'fce1',       label:'FCE I'},
  {d:4, from:'17:30', to:'18:30', group:'ket1',       label:'KET I'},
  {d:4, from:'18:45', to:'19:45', group:'b1-seniors', label:'B1 + Seniors'},
  /* FRIDAY */
  {d:5, from:'15:45', to:'17:45', group:'friday-b2', label:'Friday B2'}
];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const hhmm = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
/* Which class is it? Inside the lesson (or in the 45 min before it),
   that one. Otherwise the next one still to come today. Otherwise null
   and the Arcade just opens on the first unit it has. */
function slotFor(now){
  const d=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  const today=TIMETABLE.filter(s=>s.d===d).sort((a,b)=>hhmm(a.from)-hhmm(b.from));
  return today.find(s=>mins>=hhmm(s.from)-45 && mins<=hhmm(s.to))
      || today.find(s=>mins<hhmm(s.from))
      || null;
}

/* ---------- teams ----------------------------------------------
   Configured once from the Teams screen and kept for the whole
   lesson: switching game (or unit) never wipes the scores. The
   handicap is a points multiplier — a team of 2 playing against
   teams of 3 earns 1.5× — so a short-handed team stays in it
   without anyone having to remember a rule mid-game.
   --------------------------------------------------------------- */
const Teams = {
  list:[], turn:0, handicap:true, configured:false,
  blank(n){ return Array.from({length:n},(_,i)=>({name:'Team '+(i+1),members:[],score:0})); },
  /* used by games; only builds default teams if none were set up */
  init(n=3){ if(!this.configured){ this.list=this.blank(n); this.configured=true; this.recalc(); } this.turn=0; this.render(); },
  configure(n,names){
    const teams=this.blank(n);
    shuffle(names.filter(s=>s.trim())).forEach((nm,i)=>teams[i%n].members.push(nm.trim()));
    teams.forEach(t=>{ if(t.members.length) t.name=t.members.join(' & ').length<=22
      ? t.members.join(' & ') : t.name; });
    this.list=teams; this.turn=0; this.configured=true; this.recalc();
  },
  /* multiplier = biggest team ÷ this team, so the short team earns more */
  recalc(){
    const sizes=this.list.map(t=>t.members.length);
    const max=Math.max(1,...sizes);
    this.list.forEach(t=>{
      const s=t.members.length;
      t.mult = (this.handicap && s>0 && s<max) ? Math.round((max/s)*10)/10 : 1;
    });
  },
  add(pts){ const t=this.list[this.turn]; const actual=Math.round(pts*(t.mult||1)); t.score+=actual; this._trackWeekly(t.name,actual); this.render(); },
  steal(fromIdx,pts){
    const a=this.list[this.turn], b=this.list[fromIdx];
    if(!b||b===a) return;
    b.score-=pts; a.score+=pts; this._trackWeekly(a.name,pts); this.render();
  },
  next(){ this.turn=(this.turn+1)%this.list.length; this.render(); },
  html(){ return '<div class="teams">'+this.list.map((t,i)=>
      `<div class="team ${i===this.turn?'on':''}">
         <button class="nm" style="background:transparent;color:inherit;text-align:left" onclick="Teams.select(${i})" aria-label="Select ${esc(t.name)}">${esc(t.name)}</button>
         ${t.mult>1?`<span class="mult">×${t.mult}</span>`:''}
         <span class="sc">${t.score}</span>
         <span class="pm"><button onclick="Teams.bump(${i},-1)">−</button>
         <button onclick="Teams.bump(${i},1)">+</button></span></div>`).join('')+
      `<button class="winbtn" onclick="Teams.declareWinner()" aria-label="Declare winner" title="Declare winner"><span>🏆</span></button>`
      +'</div>'+this._weeklyBarHtml(); },
  /* Compact weekly-progress strip. Shows each team's accumulated ISO-week
     points and a thin bar toward WEEKLY_THRESHOLD. Only renders when a
     group is loaded (Game.unit is set). */
  _weeklyBarHtml(){
    const group = Game.unit && Game.unit.group;
    if(!group || !this.list.length) return '';
    const totals = WeeklyScores.totals(group);
    const anyUnlocked = WeeklyScores.isUnlocked(group);
    const slots = this.list.map(t=>{
      const wt = totals[t.name] || 0;
      const pct = Math.min(100, Math.round(wt / WEEKLY_THRESHOLD * 100));
      const done = wt >= WEEKLY_THRESHOLD;
      const nm = t.name.split(/[\s&]+/)[0].slice(0,6);
      return `<span class="wt-slot"><span class="wt-nm">${esc(nm)}</span>`+
             `<span class="wt-pts">${wt}</span>`+
             `<span class="wt-bar${done?' done':''}"><span class="wt-bar-fill" style="width:${pct}%"></span></span>`+
             `</span>`;
    }).join('');
    const status = anyUnlocked
      ? `<span class="wlbl" style="color:var(--gold)">✓ UNLOCKED</span>`
      : `<span class="wlbl" style="color:rgba(255,255,255,.38)">/${WEEKLY_THRESHOLD}</span>`;
    return `<div class="weekly-bar"><span class="wlbl">📰 Week</span>${slots}${status}</div>`;
  },
  /* Called from add() and steal() to persist points and fire the unlock
     celebration when a team first crosses WEEKLY_THRESHOLD this week. */
  _trackWeekly(teamName, pts){
    if(pts <= 0) return;
    const group = Game.unit && Game.unit.group;
    if(!group) return;
    const {justUnlocked} = WeeklyScores.add(group, teamName, pts);
    if(justUnlocked){
      setTimeout(()=>{
        if(ov.classList.contains('on')) return; // don't interrupt an active question
        ov.className='ov on';
        ov.innerHTML=`<div class="badge">📰 SOMERSET SUNDAY SPECIAL</div>
          <div class="q" style="color:var(--gold)">${esc(teamName)} have unlocked this week's issue!</div>
          <div class="q" style="font-size:clamp(16px,2vw,26px);color:rgba(255,255,255,.85)">Pick it up on Sunday. You earned it.</div>
          <div class="row"><button class="btn" onclick="ov.classList.remove('on')"><span>Brilliant ✓</span></button></div>`;
      }, 450);
    }
  },
  select(i){ if(Game._memSelected?.length || ov.classList.contains('on')){ toast('Finish this turn before changing team.'); return; } this.turn=i; this.render(); },
  bump(i,d){ this.list[i].score+=d; this.render(); },
  render(){ const el=$('#teamsBox'); if(el) el.innerHTML=this.html(); },
  /* Manual "declare winner" screen, added 18 Sep 2026 at Hugo's request.
     Deliberately a button the teacher presses, never an automatic
     threshold — same philosophy as the rest of the Arcade: the teacher
     always decides when a round is over, nothing on screen scores or
     ends anything by itself. Ties show every team that's tied. */
  declareWinner(){
    if(!this.list.length) return;
    const max=Math.max(...this.list.map(t=>t.score));
    const winners=this.list.filter(t=>t.score===max);
    ov.className='ov on winner';
    ov.innerHTML=`<div class="badge">🏆 WINNER</div>
      <div class="q winnerName">${winners.map(w=>esc(w.name)).join(' & ')}</div>
      <div class="q" style="font-size:clamp(20px,3vw,40px);color:var(--gold)">${max} point${max===1?'':'s'}${winners.length>1?' — tie!':''}</div>
      <div class="row"><button class="btn" onclick="ov.classList.remove('on')"><span>Close</span></button></div>`;
  }
};

/* friendly icon per class, for the intro screen only — purely cosmetic */
const GROUP_ICON = {flyers:'🧒',fce1:'🎓',ket1:'🔑','b1-seniors':'🌿',pet1:'📗','adults-b12':'💬','b2-conv':'🗣️'};

/* ---------- engine ---------- */
const Game = {
  unit:null, _ids:[], version:'original',
  versions(fn,title){
    this._launch=fn; this._title=title;
    stage.innerHTML=`<div class="pad"><h1 class="h1">${esc(title)}</h1>
      <p class="sub">Choose a version. Teams and points carry across games.</p>
      <div class="tiles">${[['original','Original','Play the original game.'],['tf','True or false',fn==='Game.memory()'?'Compare the two pictures. Is the sentence true?':'Decide whether the suggested answer is correct.'],['gap','Fill in','Complete the missing answer out loud.'],['mc','Multiple choice','Choose from the answers on screen.']].map(([v,t,d],i)=>tile('▶',t,d,`Game.startVersion('${v}')`,i)).join('')}</div>
      <p class="sub">Turn Two and the points games use your chosen question format. Guess Who, Word Flash, Speed Round, Hangman and The Case offer a unit-question quiz edition.</p>
      <div class="row"><button class="btn ghost" onclick="Game.setup()"><span>Set up teams</span></button><button class="btn ghost" onclick="Game.home()"><span>Back</span></button></div></div>`;
  },
  startVersion(v){
    this.version=v; this._pool=null; this._memSelected=[];
    const fn=this._launch;
    if(v!=='original' && /Game\.(guessWho|flash|speed|theCase|hangman)/.test(fn)){ this.quizEdition(); return; }
    const match=fn.match(/^Game\.(\w+)\((?:'([^']*)')?\)$/);
    if(match) this[match[1]](match[2]);
  },
  questionPool(topic){
    const qs=(this.unit.questions||[]).filter(q=>!topic||q.topic===topic);
    if(this.version==='gap'){
      const gaps=qs.filter(q=>q.type==='gap');
      if(gaps.length) return gaps;
      return qs.map(q=>({...q,q:q.q+' Answer: ___'}));
    }
    return qs;
  },
  questionView(q){
    let prompt=q.q, answer=q.a, choices=[];
    const pool=this.questionPool();
    /* Prefer a distractor from the SAME topic tag as q, so a True/False
       suggested answer is a plausible near-miss rather than a random
       answer from a different part of the unit that reads as obviously
       false. Falls back to the old whole-unit-by-type pool when the
       question has no topic or too few topic-mates. Added 18 Sep 2026
       at Hugo's request after the Friday B2 class. */
    const sameTopic=q.topic?pool.filter(x=>x.topic===q.topic&&x.type===q.type&&x.a!==q.a):[];
    const byType=pool.filter(x=>x.type===q.type);
    const wrongPool=sameTopic.length?sameTopic:byType;
    const wrong=[...new Set(wrongPool.map(x=>x.a))].filter(a=>a!==q.a);
    if(this.version==='tf'){
      const isFalse=wrong.length>0 && Math.random()<0.5;
      const candidate=isFalse?shuffle(wrong)[0]:q.a;
      this._tfIsFalse=candidate!==q.a; this._tfCorrectAnswer=q.a;
      prompt+=' Suggested answer: “'+candidate+'”. True or false?';
      answer=(this._tfIsFalse?'False':'True')+' — '+q.a; choices=['True','False'];
    } else if(this.version==='mc') choices=shuffle([q.a,...shuffle(wrong).slice(0,3)]);
    return `<div class="q">${esc(prompt)}</div>${choices.length?`<div class="row" style="display:flex;gap:12px;flex-wrap:wrap">${choices.map(c=>`<span class="chip"><span>${esc(c)}</span></span>`).join('')}</div>`:''}<div class="a" id="ansBox">${esc(answer)}</div>`;
  },
  quizEdition(){

  tfBonusRound(){

     note above intro()) — nothing here runs unless the URL asks for it.

     Query string, for an external page linking in (e.g. a course-plan
     console reading TIMETABLE_2026-27.md):
       index.html?unit=fce1-u01b&game=pointGrab

               registered under in units/*.js, e.g. fce1-u01, fce1-u01b.

       index.html#unit=unit-02&play=pointGrab&topic=have%20to

     query string or the hash; `topic` (Point Grab only) does too. The

  deepLink(){

  /* ---- 1 · POINT GRAB (the Baamboozle-style core) ---- */
  pointGrab(topic){
    Teams.init(3);
    /* take up to 20 questions, but never draw an empty tile.
       an optional topic narrows the pool to questions tagged with it —
       e.g. pointGrab('summer') only draws from the word-search set,
       so the game never surfaces grammar the class hasn't met yet. */
    const pool = this.questionPool(topic);
    const qs = shuffle(pool).slice(0,20);
    const nSteal = qs.length>=10?2:1, nDouble = qs.length>=10?2:1;
    const vals = shuffle(qs.map((_,i)=> i<nSteal?'STEAL': i<nSteal+nDouble?'x2': (i%4===0?15:10)));
    const cols = qs.length>=20?5 : qs.length>=12?4 : 3;
    stage.innerHTML = `<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div style="display:flex;justify-content:center;margin:-4px 0 10px">
        <button class="tmrbtn${this.pgTimer?'':' off'}" id="pgTimerBtn" onclick="Game.togglePGTimer()"
          >&#9201; ${POINT_GRAB_SECONDS}s countdown: ${this.pgTimer?'ON':'OFF'}</button></div>
      <div class="grid" id="grid" style="grid-template-columns:repeat(${cols},1fr)">${qs.map((q,i)=>
        `<button class="cell" id="c${i}" style="--i:${i}" data-n="${i+1}" onclick="Game.openQ(${i})"
          ><span class="pts">${vals[i]==='STEAL'?'STEAL':vals[i]==='x2'?'×2':vals[i]}</span></button>`).join('')}
      </div></div>`;
    this._qs=qs; this._vals=vals;
  },
  /* a stinger: a full-screen motion overlay that flies in and vanishes.
     This is how the hidden value of a tile is revealed — the class only
     finds out it was a ×2 or a STEAL after somebody has committed. */
  sting(kind,label){
    const el=document.createElement('div');
    el.className='sting '+kind;
    el.innerHTML=`<div class="stingtxt">${esc(label)}</div>`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), kind==='pts'?800:1300);
    return el;
  },
  /* The countdown is teacher-facing pressure, not an auto-marker: when it

  pgTimer:true,

  // Broad visible hair categories checked against cards/01.jpg–24.jpg.
  // Equal categories produce no comparative claim; grey hair has no shade rank.
  pictureTraits:{1:[0,2,0],2:[0,2,1],3:[0,1,0],4:[0,0,0],5:[0,null,0],6:[2,2,0],7:[2,1,0],8:[1,0,0],9:[0,1,2],10:[0,2,2],11:[1,1,2],12:[2,2,2],13:[0,1,2],14:[0,2,2],15:[1,0,2],16:[2,2,2],17:[1,0,0],18:[1,1,0],19:[2,2,0],20:[null,1,null],21:[2,2,2],22:[0,null,0],23:[0,null,0],24:[2,0,1]},
  // Height is not a visual read from a head-and-shoulders photo -- it comes
  // straight from the card's existing Top Trumps stat (stats.height, 1-10),
  // the same number already printed on the physical deck. Shown under the
  // photo below, not inferred, so nobody is guessing an invisible fact.
  pictureStatements(cards){
    const left=this.pictureTraits[cards[0].n],right=this.pictureTraits[cards[1].n];
    if(!left||!right) return [];
    const trueOptions=[],falseOptions=[];
    const dims=[
      {more:'longer',less:'shorter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][0]},
      {more:'darker',less:'lighter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][1]},
      {more:'curlier',less:'straighter',tpl:a=>`has ${a} hair`,val:c=>this.pictureTraits[c.n]&&this.pictureTraits[c.n][2]},
      {more:'taller',less:'shorter',tpl:a=>`is ${a}`,val:c=>c.stats&&c.stats.height}
    ];
    dims.forEach(({more,less,tpl,val})=>{
      const lv=val(cards[0]),rv=val(cards[1]);
      if(lv==null||rv==null||lv===rv) return;
      const leftMore=lv>rv;
      for(const side of ['left','right']) for(const adjective of [more,less]){
        const correct=(side==='left' ? leftMore : !leftMore)===(adjective===more);
        (correct?trueOptions:falseOptions).push({text:`The person on the ${side} ${tpl(adjective)}.`,correct});
      }
    });
    if(!trueOptions.length) return [];
    return shuffle([shuffle(trueOptions)[0],...shuffle(falseOptions).slice(0,2)]);
  },
  askMemoryChoice(){
    const cards=this._memSelected.map(i=>this._memCards[i]);
    if(cards.length!==2) return;
    const prompts=[
      ['Who looks happier?', 'looks ___ than', 'happy'],
      ['Who looks older?', 'looks ___ than', 'old'],
      ['Who looks younger?', 'looks ___ than', 'young'],
      ['Who has longer hair?', 'has ___ hair than', 'long'],
      ['Who has shorter hair?', 'has ___ hair than', 'short'],
      ['Who has curlier hair?', 'has ___ hair than', 'curly'],
      ['Who is taller?', 'is ___ than', 'tall'],
      ['Who is shorter?', 'is ___ than', 'short']
    ];
    const prompt=shuffle(prompts)[0], gap=this.version==='gap';
    this._pictureOptions=gap?[]:this.pictureStatements(cards);
    if(!gap && this._pictureOptions.length!==3){
      const last=this._memSelected.pop(); $$('#bd .pc')[last].classList.remove('flip');
      toast('These photos are too similar for a clear question. Choose a different second card.'); return;
    }
    this._pictureChoice=null; this._pictureChecked=false;
    this._cb=ok=>this.finishMemory(ok);
    ov.className='ov on picture-tf';
    ov.innerHTML=`<div class="badge">Turn Two · ${gap?'Fill in':'Multiple choice'}</div>
      <div class="picture-pair">${cards.map((c,i)=>`<figure><img src="${c.img}" alt="${i===0?'Left':'Right'} picture, card ${c.n}"><figcaption>${i===0?'Left':'Right'} · Card ${c.n}<br>Height ${'●'.repeat(Math.round((c.stats&&c.stats.height||0)/2))}${'○'.repeat(5-Math.round((c.stats&&c.stats.height||0)/2))}</figcaption></figure>`).join('')}</div>
      <div class="q">${gap?`The person on the left ${prompt[1]} the person on the right. (${prompt[2]})`:'Which sentence is true?'}</div>
      ${gap?'<p class="picture-hint">Complete the comparative, then decide whether the sentence fits the pictures. Swap left and right if needed.</p>':`<div class="row" style="display:flex;gap:12px;flex-wrap:wrap">${this._pictureOptions.map((option,i)=>`<button class="btn ghost picture-choice" aria-pressed="false" onclick="Game.chooseMemoryAnswer(${i})"><span>${i+1}. ${esc(option.text)}</span></button>`).join('')}</div><p id="pictureSelection" class="picture-hint" aria-live="polite">Choose the one sentence that matches the pictures.</p>`}
      <p class="picture-hint">${gap?'Teacher: accept an answer supported by the pictures.':'One correct answer. Choose a sentence, then check it.'}</p>
      <div class="row" style="display:flex;gap:12px;flex-wrap:wrap"><button id="pictureAccept" class="btn" ${gap?'':'disabled'} onclick="${gap?'Game.resolve(true)':'Game.checkMemoryAnswer()'}"><span>${gap?'Accept answer · +1':'Check answer'}</span></button><button class="btn hot" onclick="Game.resolve(false)"><span>Wrong / pass</span></button></div>`;
  },
  chooseMemoryAnswer(i){
    const labels=this._pictureOptions.map(o=>o.text);
    if(!labels[i] || !$('#pictureSelection')) return;
    this._pictureChoice=i;
    $$('.picture-choice').forEach((b,k)=>{b.setAttribute('aria-pressed',String(i===k)); b.classList.toggle('ghost',i!==k);});
    $('#pictureSelection').textContent='Selected: '+labels[i]+' Choose Check answer when ready.';
    $('#pictureAccept').disabled=false;
  },
  checkMemoryAnswer(){
    if(this._pictureChoice===null || this._pictureChecked) return;
    this._pictureChecked=true;
    const correct=this._pictureOptions[this._pictureChoice].correct;
    $('#pictureSelection').textContent=correct?'Correct! +1 point.':'Not quite. Correct: '+this._pictureOptions.find(o=>o.correct).text;
    $$('.picture-choice').forEach(b=>b.disabled=true);
    $('#pictureAccept').outerHTML=`<button class="btn" onclick="Game.resolve(${correct})"><span>Next turn</span></button>`;
  },
  askMemoryTF(){
    const cards=this._memSelected.map(i=>this._memCards[i]);
    if(cards.length!==2) return;
    const comparisons=['looks happier than','looks older than','looks younger than','has longer hair than','has shorter hair than','has curlier hair than','is taller than','is shorter than'];
    const comparison=shuffle(comparisons)[0];
    this._cb=ok=>this.finishMemory(ok);
    ov.className='ov on picture-tf';
    ov.innerHTML=`<div class="badge">Turn Two · True or false</div>
      <div class="picture-pair">${cards.map((c,i)=>`<figure><img src="${c.img}" alt="${i===0?'Left':'Right'} picture, card ${c.n}"><figcaption>${i===0?'Left':'Right'} · Card ${c.n}<br>Height ${'●'.repeat(Math.round((c.stats&&c.stats.height||0)/2))}${'○'.repeat(5-Math.round((c.stats&&c.stats.height||0)/2))}</figcaption></figure>`).join('')}</div>
      <div class="q">The person on the left ${esc(comparison)} the person on the right.</div>
      <div class="row" style="display:flex;gap:12px"><span class="chip"><span>True</span></span><span class="chip"><span>False</span></span></div>
      <p class="picture-hint">Say true or false. If false, correct the sentence. Teacher: judge from the pictures and accept a reasonable explanation.</p>
      <div class="row" style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" onclick="Game.resolve(true)"><span>Accept answer · +1</span></button><button class="btn hot" onclick="Game.resolve(false)"><span>Wrong / pass</span></button></div>`;
  },
  finishMemory(ok){
    if(this._memSelected.length!==2) return;
    if(ok) Teams.add(1);
    $$('#bd .pc').forEach(c=>c.classList.remove('flip'));
    this._memSelected=[]; $('#memCorrect').disabled=true; $('#memPass').disabled=true; Teams.next();
  },

  /* ---- 3 · GUESS WHO ---- */
  guessWho(){
    const cs=this.unit.cards;
    const secret=cs[Math.random()*cs.length|0];
    this._secret=secret;
    stage.innerHTML = `<div class="pad">
      <div class="legend">
        <span class="chip"><span>Ask <b>yes / no</b> questions only</span></span>
        <span class="chip"><span>Click a face to cross it out</span></span>
        <button class="btn ghost" onclick="Game.peek()"><span>👁 Teacher peek</span></button>
        <button class="btn ghost" onclick="Game.reveal()"><span>Reveal</span></button>
        <button class="btn" onclick="Game.guessWho()"><span>New game</span></button></div>
      <div class="board" style="grid-template-columns:repeat(8,1fr)">
        ${cs.map((c,i)=>`<button class="pc flip" style="--i:${i}" onclick="this.classList.toggle('out')">

      </div></div>`;

  },

      <div class="a on">${esc(s.hair)} · ${esc(s.colour)} · ${s.glasses?'glasses':'no glasses'} · ${s.tall?'tall':'short'}</div>
      <div class="row"><button class="btn" onclick="ov.classList.remove('on')"><span>Close</span></button></div>`;
  },

  /* ---- 4 · SPEED ROUND ---- */
  speed(){
    const words=shuffle(this.unit.vocab);let i=0;
    Teams.init(2);
    /* the Spanish stays hidden until the teacher shows it — otherwise
       the answer is on the board before anybody has tried */
    const show=()=>{ const w=words[i%words.length];
      $('#spw').innerHTML=`<div class="q">${esc(w.w)}</div>
        <div class="a" id="spa">${esc(w.t)}</div>`; };
    stage.innerHTML=`<div class="pad"><div id="teamsBox">${Teams.html()}</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px" id="spw"></div>
      <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" onclick="$('#spa').classList.add('on')"><span>Show Spanish</span></button>
        <button class="btn" onclick="Teams.add(1);Game._sp()"><span>✔ Got it (+1)</span></button>
        <button class="btn ghost" onclick="Game._sp()"><span>Skip ▶</span></button>
        <button class="btn ghost" onclick="Teams.next()"><span>↻ Next team</span></button>
        <button class="btn hot" onclick="timer(60)"><span>▶ 60 seconds</span></button>
      </div></div>`;
