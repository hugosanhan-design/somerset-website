<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punctuation Repair — Somerset Games</title>
  <meta name="description" content="Broken sentences arrive at your workshop. Put them right.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F5F1E6; --paper-2: #EDE7D6; --ink: #17281B; --racing: #1E4227;
      --green: #57B82C; --green-dk: #3D8B1F; --leaf: #A8D77E; --brass: #C9A24B;
      --heather: #8C5E9C; --cheddar: #E3A33A; --cider: #B23A2C; --muted: #5C6657; --line: #D9D2BC;
      --accent: var(--heather);
      --serif: 'Fraunces', Georgia, serif; --sans: 'Instrument Sans', system-ui, sans-serif; --brand: 'Poppins', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--green); color: #fff; }
    .wrap { width: min(760px, 100%); margin: 0 auto; padding: 0 1.4rem; }

    .nav { padding: 1rem 0; background: rgba(245,241,230,0.92); box-shadow: 0 1px 0 var(--line); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .nav-logo { font-family: var(--brand); font-size: 1.1rem; font-weight: 700; }
    .nav-logo b { color: var(--green); }
    .nav-back { font-size: 0.88rem; font-weight: 600; color: var(--green-dk); }
    .nav-back:hover { color: var(--racing); }

    main { flex: 1; display: flex; align-items: center; padding: 2rem 0 3rem; }
    .stage { width: 100%; }

    .gtag { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
    .gtag::before { content: ''; width: 34px; height: 1px; background: var(--accent); }
    h1 { font-family: var(--serif); font-size: clamp(2.2rem, 6vw, 3.2rem); font-weight: 380; letter-spacing: -0.015em; line-height: 1.05; margin-bottom: 0.9rem; }
    h1 em { font-style: italic; color: var(--green-dk); }
    .lead { color: var(--muted); max-width: 46ch; margin-bottom: 1.8rem; text-wrap: pretty; }

    .panel { background: #FBF9F2; border: 1px solid var(--line); border-radius: 20px; padding: 1.8rem; position: relative; overflow: hidden; }
    .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); }

    .player-line { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
    .player-line strong { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
    .player-line strong em { font-style: italic; color: var(--green-dk); }
    .player-line .best { font-size: 0.8rem; color: var(--muted); }
    .lvl-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .lvl-chip { font-family: var(--sans); font-size: 0.85rem; font-weight: 600; background: transparent; color: var(--muted); border: 1.5px solid var(--line); border-radius: 50px; padding: 0.5rem 1rem; cursor: pointer; transition: all 0.15s; }
    .lvl-chip:hover { border-color: var(--green-dk); color: var(--green-dk); }
    .lvl-chip.on { background: var(--racing); border-color: var(--racing); color: #fff; }
    .name-row { margin-bottom: 1.5rem; }
    .name-row input { font-family: var(--sans); font-size: 0.95rem; border: 1.5px solid var(--line); background: #fff; border-radius: 50px; padding: 0.6rem 1.1rem; width: 210px; outline: none; }
    .name-row input:focus { border-color: var(--green-dk); }

    .btn { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--sans); font-size: 0.95rem; font-weight: 600; padding: 0.85rem 1.8rem; border-radius: 50px; border: 1.5px solid transparent; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 6px 18px rgba(87,184,44,0.28); }
    .btn-primary:hover { background: var(--green-dk); transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--green-dk); color: var(--green-dk); }

    /* HUD */
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .hud .score { color: var(--racing); }
    .hud .streak { color: var(--cheddar); }
    .tbar { height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; margin-bottom: 1.6rem; }
    .tbar > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.24s linear; }
    .tbar.low > div { background: var(--cider); }

    .q { font-family: var(--serif); font-size: clamp(1.3rem, 3.4vw, 1.7rem); font-weight: 400; line-height: 1.4; margin-bottom: 1.6rem; min-height: 3em; }
    .q .gap { display: inline-block; min-width: 3.2em; border-bottom: 2.5px solid var(--brass); margin: 0 0.15em; text-align: center; font-style: italic; color: var(--green-dk); }
    .opts { display: grid; grid-template-columns: 1fr; gap: 0.7rem; }
    .opt { font-family: var(--sans); font-size: 1rem; font-weight: 500; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.14s; }
    .opt:hover { border-color: var(--green-dk); transform: translateY(-1px); }
    .opt.right { background: #EAF6E0; border-color: var(--green); color: var(--green-dk); font-weight: 700; }
    .opt.wrong { background: #F9E9E6; border-color: var(--cider); color: var(--cider); }
    .opt:disabled { cursor: default; }

    /* End screen */
    .end-score { font-family: var(--serif); font-size: clamp(3rem, 9vw, 4.6rem); font-weight: 400; line-height: 1; color: var(--racing); }
    .end-sub { color: var(--muted); margin: 0.5rem 0 1.4rem; }
    .newbest { display: inline-block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: var(--brass); padding: 0.4rem 1rem; border-radius: 50px; margin-bottom: 1.2rem; }
    .review { margin: 1.4rem 0; border-top: 1px solid var(--line); }
    .review-item { padding: 0.85rem 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    .review-item .rq { color: var(--muted); }
    .review-item .ra { font-weight: 600; }
    .review-item .ra.ok { color: var(--green-dk); }
    .review-item .ra.no { color: var(--cider); text-decoration: line-through; margin-right: 0.5rem; }
    .end-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.6rem; }
    .sheep-cheer { display: flex; align-items: center; gap: 0.9rem; margin-top: 1.4rem; color: var(--muted); font-size: 0.9rem; font-style: italic; }
    .sheep-cheer svg { width: 46px; flex-shrink: 0; }

    .hide { display: none !important; }
    @media (max-width: 560px) { .panel { padding: 1.4rem 1.2rem; } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a href="/games/index.html" class="nav-logo"><b>Somerset</b> Games</a>
    <a href="/games/index.html" class="nav-back">← All games</a>
  </div>
</nav>

<main>
  <div class="wrap stage">

    <!-- START -->
    <section id="scrStart">
      <div class="gtag">Somerset Games · Punctuation</div>
      <h1>Punctuation <em>Repair</em></h1>
      <p class="lead">Six broken sentences arrive at your workshop — no clock, just craft. Commas, apostrophes and capitals: the details Cambridge examiners actually mark.</p>
      <div class="panel">
        <div class="player-line">
          <strong id="pGreet"></strong>
          <span class="best" id="pBest"></span>
        </div>
        <div class="name-row hide" id="nameRow"><input type="text" id="pName" maxlength="24" placeholder="Your name (optional)"></div>
        <div class="lvl-row" id="lvlRow"></div>
        <button class="btn btn-primary" id="btnStart">Open the workshop →</button>
      </div>
    </section>

    <!-- PLAY -->
    <section id="scrPlay" class="hide">
      <div class="hud">
        <span id="hudQ">1 / 10</span>
        <span class="streak" id="hudStreak"></span>
        <span class="score" id="hudScore">0 pts</span>
      </div>
      <div class="tbar" id="tbar"><div id="tfill" style="width:100%"></div></div>
      <div class="panel">
        <div class="q" id="qText"></div>
        <div class="opts" id="opts"></div>
      </div>
    </section>

    <!-- END -->
    <section id="scrEnd" class="hide">
      <div class="gtag">Workshop closed</div>
      <div class="panel">
        <span class="newbest hide" id="newBest">★ New personal best</span>
        <div class="end-score" id="endScore">0</div>
        <div class="end-sub" id="endSub"></div>
        <div class="sheep-cheer hide" id="sheepCheer">
          <svg viewBox="0 0 54 44" xmlns="http://www.w3.org/2000/svg">
            <rect x="18" y="28" width="2.4" height="11" fill="#33302a"/><rect x="32" y="28" width="2.4" height="11" fill="#33302a"/>
            <ellipse cx="28" cy="22" rx="16" ry="12" fill="#EFE9DA"/>
            <circle cx="16" cy="16" r="6" fill="#EFE9DA"/><circle cx="27" cy="12" r="7" fill="#EFE9DA"/><circle cx="39" cy="16" r="6" fill="#EFE9DA"/>
            <ellipse cx="12" cy="24" rx="4.5" ry="6.5" fill="#3a342b" transform="rotate(-32 12 24)"/>
            <ellipse cx="15" cy="19" rx="2.4" ry="1.4" fill="#3a342b"/>
          </svg>
          <span id="sheepSay"></span>
        </div>
        <div class="review" id="review"></div>
        <div class="end-actions">
          <button class="btn btn-primary" id="btnAgain">Play again →</button>
          <button class="btn btn-ghost" id="btnLevel">Change level</button>
          <a class="btn btn-ghost" href="/games/index.html">All games</a>
        </div>
      </div>
    </section>

  </div>
</main>

<script>
/* ═══════════ CONTENT — Grammar Sprint (gap-fill MCQ) ═══════════
   {s: sentence with ___, a: correct, w: [wrong options]}         */
const CONTENT = {
  A2: [
    { s: "Capitals and commas — which is correct?", a: "My name is Ana, and I live in Valencia.", w: ["my name is Ana and i live in valencia", "My name is Ana and, I live in Valencia."] },
    { s: "Apostrophes — which is correct?", a: "It's Monday.", w: ["Its Monday.", "its monday."] },
    { s: "Lists — which is correct?", a: "I like apples, oranges and bananas.", w: ["I like apples oranges and bananas.", "I like, apples, oranges and bananas."] },
    { s: "Questions — which is correct?", a: "Where are you from?", w: ["Where are you from.", "where are you from?"] },
    { s: "Apostrophes — which is correct?", a: "She doesn't like coffee.", w: ["She doesnt like coffee.", "She dose'nt like coffee."] },
    { s: "Capitals — which is correct?", a: "We went to Madrid in April.", w: ["we went to madrid in april.", "We went to madrid in April."] },
    { s: "Possessives — which is correct?", a: "My brother's car is red.", w: ["My brothers car is red.", "My brothers' car is red. (one brother)"] },
    { s: "Short answers — which is correct?", a: "Yes, I do.", w: ["Yes I do", "yes, I do."] },
    { s: "they're / their / there — which is correct?", a: "They're at home.", w: ["Their at home.", "There at home."] }
  ],
  B1: [
    { s: "Conditionals — which is correct?", a: "If it rains, we'll stay in.", w: ["If it rains we'll stay in.", "If it rains, well stay in."] },
    { s: "Relative clauses — which is correct?", a: "London, which is huge, is expensive.", w: ["London which is huge is expensive.", "London, which is huge is expensive."] },
    { s: "Direct speech — which is correct?", a: "\u201CI'm tired,\u201D she said.", w: ["\u201CI'm tired\u201D she said.", "\u201CIm tired,\u201D she said."] },
    { s: "it's / its — which is correct?", a: "It's been years since we met.", w: ["Its been years since we met.", "It's been year's since we met."] },
    { s: "Possessives — which is correct?", a: "The children's toys are everywhere.", w: ["The childrens' toys are everywhere.", "The childrens toys are everywhere."] },
    { s: "Linking words — which is correct?", a: "However, I disagree.", w: ["However I disagree.", "However; I disagree."] },
    { s: "Lists — which is correct?", a: "She likes cooking, reading and swimming.", w: ["She likes cooking reading and swimming.", "She likes, cooking, reading and swimming."] },
    { s: "whose / who's — which is correct?", a: "Whose bag is this?", w: ["Who's bag is this?", "Whose bag is this."] },
    { s: "Joining sentences — which is correct?", a: "I can't come; I'm working late.", w: ["I can't come, I'm working late.", "I cant come; I'm working late."] }
  ],
  B2: [
    { s: "Non-defining clauses — which is correct?", a: "The report, which took weeks, was ignored.", w: ["The report which took weeks was ignored.", "The report, which took weeks was ignored."] },
    { s: "Semicolons — which is correct?", a: "It's the company's policy; everyone must comply.", w: ["It's the company's policy, everyone must comply.", "Its the company's policy; everyone must comply."] },
    { s: "Participle clauses — which is correct?", a: "Having finished the exam, the students left.", w: ["Having finished the exam the students left.", "Having finished the exam, the students', left."] },
    { s: "Dashes — which is correct?", a: "He said he'd call — he never did.", w: ["He said he'd call he never did.", "He said hed call — he never did."] },
    { s: "Decades — which is correct?", a: "The 1990s were transformative.", w: ["The 1990's were transformative.", "The 1990s' were transformative."] },
    { s: "Colons — which is correct?", a: "Everyone's invited: students, parents and teachers.", w: ["Everyones invited: students, parents and teachers.", "Everyone's invited, students, parents and teachers."] },
    { s: "Subject clauses — which is correct?", a: "Whoever arrives first gets the seats.", w: ["Whoever arrives first, gets the seats.", "Whoever, arrives first, gets the seats."] },
    { s: "Hyphens — which is correct?", a: "It was a well-known problem.", w: ["It was a well known problem.", "It was a well-known-problem."] },
    { s: "Indirect questions — which is correct?", a: "She asked whether we'd finished.", w: ["She asked whether we'd finished?", "She asked wether we'd finished."] }
  ],
  C1: [
    { s: "Dashes — which is correct?", a: "The data — startling as it was — went unpublished.", w: ["The data — startling as it was, went unpublished.", "The data startling as it was — went unpublished."] },
    { s: "whose / who's — which is correct?", a: "He's the author whose novel won.", w: ["He's the author who's novel won.", "Hes the author whose novel won."] },
    { s: "its / it's — which is correct?", a: "Its impact, however, remains unclear.", w: ["It's impact, however, remains unclear.", "Its impact however remains unclear."] },
    { s: "Possessives of time — which is correct?", a: "A decade's worth of research was lost.", w: ["A decades worth of research was lost.", "A decades' worth of research was lost."] },
    { s: "Semicolons — which is correct?", a: "The committee agreed; the directors, however, did not.", w: ["The committee agreed, the directors, however, did not.", "The committee agreed; the directors however did not,"] },
    { s: "Direct speech — which is correct?", a: "\u201CStop,\u201D he whispered, \u201Cbefore it's too late.\u201D", w: ["\u201CStop\u201D he whispered \u201Cbefore it's too late.\u201D", "\u201CStop,\u201D he whispered, \u201Cbefore its too late.\u201D"] },
    { s: "Compound adjectives — which is correct?", a: "Twenty-first-century readers expect brevity.", w: ["Twenty first century readers expect brevity.", "Twenty-first century readers expect brevity."] },
    { s: "Parenthetical dashes — which is correct?", a: "The team — engineers, designers and writers — shipped early.", w: ["The team — engineers, designers and writers shipped early.", "The team, engineers, designers and writers — shipped early."] },
    { s: "Inversion — which is correct?", a: "Had I known, I wouldn't have asked.", w: ["Had I known I wouldn't have asked.", "Had I known, I wouldn't of asked."] }
  ]
};

/* ═══════════ ENGINE — Somerset drill (canonical) ═══════════ */
const GAME = {
  key: 'pr',
  roundSize: 6,
  timed: false,
  seconds: 0,
  pointsPerHit: 10
};

const LEVELS = ['A2', 'B1', 'B2', 'C1'];
const $ = id => document.getElementById(id);
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let player = null;
try { player = JSON.parse(localStorage.getItem('slc-player')); } catch (e) {}
let level = (player && player.level) || null;

let round = [], idx = 0, score = 0, streak = 0, bestStreak = 0, answers = [];
let timeLeft = GAME.seconds, timer = null;

function bestKey() { return 'slc-best-' + GAME.key + '-' + level; }
function getBest() { return parseInt(localStorage.getItem(bestKey()) || '0', 10); }

/* ── Start screen ── */
function renderStart() {
  $('scrStart').classList.remove('hide'); $('scrPlay').classList.add('hide'); $('scrEnd').classList.add('hide');
  const name = player && player.name;
  $('pGreet').innerHTML = name ? 'Ready, <em>' + name + '</em>?' : 'Ready to sprint?';
  $('nameRow').classList.toggle('hide', !!name);
  $('lvlRow').innerHTML = LEVELS.map(l => '<button class="lvl-chip' + (l === level ? ' on' : '') + '" data-l="' + l + '">' + l + '</button>').join('');
  $('lvlRow').querySelectorAll('.lvl-chip').forEach(b => b.addEventListener('click', () => {
    level = b.dataset.l;
    $('lvlRow').querySelectorAll('.lvl-chip').forEach(x => x.classList.toggle('on', x === b));
    updateStartMeta();
  }));
  updateStartMeta();
}
function updateStartMeta() {
  $('btnStart').disabled = !level;
  $('pBest').textContent = level ? (getBest() ? 'Personal best at ' + level + ': ' + getBest() + ' pts' : 'No score at ' + level + ' yet — set one!') : 'Choose your level';
}

/* ── Round ── */
function startRound() {
  const nameVal = $('pName') && $('pName').value.trim();
  if (nameVal) { player = Object.assign(player || {}, { name: nameVal, level: level }); localStorage.setItem('slc-player', JSON.stringify(player)); }
  else if (player) { player.level = level; localStorage.setItem('slc-player', JSON.stringify(player)); }

  round = shuffle(CONTENT[level]).slice(0, GAME.roundSize);
  idx = 0; score = 0; streak = 0; bestStreak = 0; answers = [];
  $('scrStart').classList.add('hide'); $('scrEnd').classList.add('hide'); $('scrPlay').classList.remove('hide');
  if (GAME.timed) {
    timeLeft = GAME.seconds;
    $('tbar').classList.remove('low');
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      $('tfill').style.width = (timeLeft / GAME.seconds * 100) + '%';
      if (timeLeft <= 15) $('tbar').classList.add('low');
      if (timeLeft <= 0) { clearInterval(timer); endRound(true); }
    }, 1000);
  } else { $('tbar').style.display = 'none'; }
  showQ();
}

function showQ() {
  const q = round[idx];
  $('hudQ').textContent = (idx + 1) + ' / ' + round.length;
  $('hudScore').textContent = score + ' pts';
  $('hudStreak').textContent = streak >= 2 ? '🔥 streak ×' + streak : '';
  $('qText').innerHTML = q.s.replace('___', '<span class="gap">&nbsp;</span>');
  const opts = shuffle([q.a].concat(q.w));
  $('opts').innerHTML = opts.map(o => '<button class="opt">' + o + '</button>').join('');
  $('opts').querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => pick(btn, q)));
}

function pick(btn, q) {
  $('opts').querySelectorAll('.opt').forEach(b => b.disabled = true);
  const right = btn.textContent === q.a;
  answers.push({ q: q.s, a: q.a, chosen: btn.textContent, right: right });
  if (right) {
    streak++; bestStreak = Math.max(bestStreak, streak);
    score += GAME.pointsPerHit + Math.max(0, (streak - 1) * 2);
    btn.classList.add('right');
    $('qText').innerHTML = q.s.replace('___', '<span class="gap">' + q.a + '</span>');
  } else {
    streak = 0;
    btn.classList.add('wrong');
    $('opts').querySelectorAll('.opt').forEach(b => { if (b.textContent === q.a) b.classList.add('right'); });
  }
  setTimeout(() => {
    idx++;
    if (idx >= round.length) endRound(false); else showQ();
  }, right ? 650 : 1400);
}

function endRound(timeUp) {
  clearInterval(timer);
  if (GAME.timed && !timeUp) score += timeLeft;   /* time bonus */
  const hits = answers.filter(a => a.right).length;
  const best = getBest();
  const isBest = score > best;
  if (isBest) localStorage.setItem(bestKey(), String(score));

  $('scrPlay').classList.add('hide'); $('scrEnd').classList.remove('hide');
  $('endScore').textContent = score + ' pts';
  $('endSub').textContent = hits + ' of ' + answers.length + ' correct at ' + level +
    (GAME.timed && !timeUp ? ' · +' + timeLeft + ' time bonus' : timeUp ? ' · time ran out!' : '') +
    (bestStreak >= 3 ? ' · best streak ×' + bestStreak : '');
  $('newBest').classList.toggle('hide', !isBest);

  const ratio = answers.length ? hits / answers.length : 0;
  const name = (player && player.name) ? player.name : 'friend';
  $('sheepCheer').classList.remove('hide');
  $('sheepSay').textContent = ratio >= 0.9 ? '"Baa-rilliant, ' + name + '!"' :
    ratio >= 0.6 ? '"Not baa-d at all. Once more?"' : '"Ewe can do better — again!"';

  $('review').innerHTML = answers.map(a =>
    '<div class="review-item"><div class="rq">' + a.q.replace('___', '⟨…⟩') + '</div>' +
    (a.right ? '<span class="ra ok">' + a.a + ' ✓</span>'
             : '<span class="ra no">' + a.chosen + '</span><span class="ra ok">' + a.a + '</span>') +
    '</div>').join('');
}

$('btnStart').addEventListener('click', startRound);
$('btnAgain').addEventListener('click', startRound);
$('btnLevel').addEventListener('click', renderStart);
renderStart();
</script>

</body>
</html>
